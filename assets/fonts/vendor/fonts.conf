<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for the CMS card renderer (id-card.ts / photocard).
     Minimal containers (Render native runtime) ship no /etc/fonts, so Pango
     cannot instantiate any font and Bengali text renders as codepoint boxes.
     This file points fontconfig at the bundle's own font directory and a
     writable cache, and is selected at runtime with FONTCONFIG_FILE. -->
<fontconfig>
  <dir prefix="cwd">fonts</dir>
  <cachedir prefix="cwd">fontconfig-cache</cachedir>
</fontconfig>
