  <rect x="105" y="175" width="26" height="34" fill="#5b7a94"/>
  <rect x="169" y="175" width="26" height="34" fill="#5b7a94"/>
  <rect x="105" y="235" width="26" height="34" fill="#5b7a94"/>
  <rect x="169" y="235" width="26" height="34" fill="#5b7a94"/>
  <rect x="137" y="320" width="26" height="80" fill="#6b4f33"/>
  <!-- the flag at the very top: the first thing cover() throws away -->
  <rect x="148" y="40" width="3" height="110" fill="#444"/>
  <rect x="151" y="42" width="60" height="38" fill="#da1c25"/>
  <!-- ground -->
  <rect y="380" width="300" height="20" fill="#6d8b52"/>
