# Shikkha24 — daily Neon → private-R2 backup (replaces backup-db.yml)
#
# WHY THIS EXISTS (pentest 2026-10-29, H5): the retired backup workflow uploaded
# the full database as a GitHub Actions ARTIFACT on a PUBLIC repo — artifacts are
# downloadable by anyone, and the dump holds reader password hashes, newsletter
# subscribers and comments. This replacement stores the dump in a PRIVATE R2
# bucket instead: objects are reachable only with the R2 credential, never
# through GitHub.
#
# It also fixes the "wrong database" half of H5: the old job backed up the
# retired DianaHost SQLite file. Production is Neon Postgres (project
# lucky-forest-26905704) since the 2026-10-28 clean start — this job dumps
# THAT database with `pg_dump`, including the media metadata tables.
#
# ## What it does
#
#   1. `pg_dump --format=custom` the whole Neon database (compressed, restorable
#      with `pg_restore`).
#   2. Integrity-proof it: `pg_restore --list` must parse the archive and list
#      the `articles` table. A truncated dump fails the run instead of storing
#      garbage (the M-series lesson: never store what you cannot verify).
#   3. Upload to R2 under `backups/YYYY-MM-DD/`, then prune local copies older
#      than 30 days (R2 lifecycle rules are the durable retention — set a 30-day
#      lifecycle on the bucket prefix if you want server-side pruning too).
#
# ## SETUP — the owner does this once (≈5 minutes)
#
#   1. Cloudflare dashboard → R2 → **Create bucket** → name `shikkha24-backups`.
#      ⚠️ Do NOT attach a custom domain or public access — stays private.
#   2. Cloudflare → R2 → **Manage R2 API Tokens** → Create API Token with
#      **Object Read & Write** scoped to bucket `shikkha24-backups` only.
#   3. GitHub → repo → Settings → Secrets and variables → Actions → add:
#        - `NEON_BACKUP_URL`      : the Neon DIRECT (unpooled) connection string
#                                   from Render's env (DATABASE_URL_UNPOOLED) —
#                                   pg_dump wants the direct endpoint.
#        - `R2_BACKUP_ACCESS_KEY` : the token's Access Key ID
#        - `R2_BACKUP_SECRET`     : the token's Secret Access Key
#      (CLOUDFLARE_ACCOUNT_ID already exists as a secret.)
#   4. Run this workflow once manually; check the R2 bucket has
#      `backups/<today>/shikkha24-<today>.dump`.
#
# ## Restore drill (do quarterly — docs/backup-and-recovery.md §7)
#
#   aws s3 cp  (or any S3 client against the R2 S3 endpoint)
#     s3://shikkha24-backups/backups/<date>/shikkha24-<date>.dump .
#   pg_restore --list shikkha24-<date>.dump            # parses = intact
#   pg_restore -d <scratch-db> shikkha24-<date>.dump   # count articles

name: Backup Neon → R2

on:
  schedule:
    # 18:00 UTC = 00:00 Asia/Dhaka — quiet editorial hour, before the old
    # job's 19:00 slot so a failing run still has a same-day retry window.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-neon
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check setup secrets exist
        env:
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          R2_BACKUP_ACCESS_KEY: ${{ secrets.R2_BACKUP_ACCESS_KEY }}
          R2_BACKUP_SECRET: ${{ secrets.R2_BACKUP_SECRET }}
        run: |
          if [ -z "$NEON_BACKUP_URL" ] || [ -z "$R2_BACKUP_ACCESS_KEY" ] || [ -z "$R2_BACKUP_SECRET" ]; then
            echo "::error::Setup incomplete. Add secrets NEON_BACKUP_URL, R2_BACKUP_ACCESS_KEY, R2_BACKUP_SECRET — see the SETUP block at the top of this file."
            exit 1
          fi

      - name: Install pg client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dump + verify + upload
        env:
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          R2_BACKUP_ACCESS_KEY: ${{ secrets.R2_BACKUP_ACCESS_KEY }}
          R2_BACKUP_SECRET: ${{ secrets.R2_BACKUP_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TODAY: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          dump="shikkha24-$today.dump"

          # 1. Dump. --no-owner --no-privileges so a restore onto a fresh
          #    database does not depend on role names existing.
          pg_dump "$NEON_BACKUP_URL" \
            --format=custom --no-owner --no-privileges \
            --file "$dump"

          size=$(stat -c%s "$dump")
          echo "dump size: $size bytes"
          [ "$size" -gt 10000 ] || { echo "::error::Dump suspiciously small ($size B) — refusing to store."; exit 1; }

          # 2. Verify: the archive must parse AND contain the articles table.
          pg_restore --list "$dump" > /tmp/toc.txt
          grep -q "articles" /tmp/toc.txt || { echo "::error::Archive parses but has no articles table — not a real backup."; exit 1; }
          echo "toc entries: $(wc -l < /tmp/toc.txt)"

          # 3. Upload to the PRIVATE bucket via the S3 API (R2 is S3-compatible).
          date -u +%Y%m%d%H%M%S > stamp.txt
          python3 - << 'PY'
          import hashlib, hmac, os, datetime, urllib.request, pathlib

          acc   = os.environ['CLOUDFLARE_ACCOUNT_ID']
          key   = os.environ['R2_BACKUP_ACCESS_KEY']
          sec   = os.environ['R2_BACKUP_SECRET']
          host  = f'{acc}.r2.cloudflarestorage.com'
          bucket = 'shikkha24-backups'
          dump  = [p for p in pathlib.Path('.').glob('shikkha24-*.dump')][0]
          objkey = f'backups/{dump.name[10:20]}/{dump.name}'

          now = datetime.datetime.now(datetime.timezone.utc)
          amzdate = now.strftime('%Y%m%dT%H%M%SZ')
          datestamp = now.strftime('%Y%m%d')
          payload_hash = hashlib.sha256(dump.read_bytes()).hexdigest()
          region = 'auto'
          service = 's3'

          canonical_uri = f'/{bucket}/{objkey}'
          canonical_headers = (f'host:{host}\n'
                               f'x-amz-content-sha256:{payload_hash}\n'
                               f'x-amz-date:{amzdate}\n')
          signed_headers = 'host;x-amz-content-sha256;x-amz-date'
          canonical_request = (f'PUT\n{canonical_uri}\n\n{canonical_headers}\n'
                               f'{signed_headers}\n{payload_hash}')
          scope = f'{datestamp}/{region}/{service}/aws4_request'
          string_to_sign = (f'AWS4-HMAC-SHA256\n{amzdate}\n{scope}\n'
                            + hashlib.sha256(canonical_request.encode()).hexdigest())

          def hmac_sha256(key, msg):
              return hmac.new(key, msg.encode(), hashlib.sha256).digest()

          k_date = hmac_sha256(('AWS4' + sec).encode(), datestamp)
          k_region = hmac_sha256(k_date, region)
          k_service = hmac_sha256(k_region, service)
          k_signing = hmac_sha256(k_service, 'aws4_request')
          signature = hmac.new(k_signing, string_to_sign.encode(), hashlib.sha256).hexdigest()

          url = f'https://{host}{canonical_uri}'
          req = urllib.request.Request(url, method='PUT', data=dump.read_bytes())
          req.add_header('x-amz-content-sha256', payload_hash)
          req.add_header('x-amz-date', amzdate)
          req.add_header('Authorization',
                         f'AWS4-HMAC-SHA256 Credential={key}/{scope}, '
                         f'SignedHeaders={signed_headers}, Signature={signature}')
          with urllib.request.urlopen(req, timeout=300) as resp:
              print('upload status:', resp.status)
          PY

      - name: Retention note
        run: |
          echo "Stored: s3://shikkha24-backups/backups/$(date -u +%F)/"
          echo "Retention: 30 daily dumps is the documented tier-1 window."
          echo "Optional: add a 30-day lifecycle rule on the bucket in the Cloudflare dashboard."
