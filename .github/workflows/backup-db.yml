# Shikkha24 — daily off-host database + media backup
#
# Source: docs/backup-and-recovery.md §3 (tier 1) and §6 (automating the dump).
#
# WHY THIS IS CRITICAL: the ENTIRE editorial archive — every article, every
# education record, every reader account — lives in ONE SQLite file on a 2 GB
# shared hosting account. Losing it ends the business. There is no redundancy.
#
# The rule from §2: "an untested backup is not a backup." A backup that has never
# been restored is an assumption. The restore drill is a separate S12 gate.
#
# Targets (§4): RPO 24h (this runs daily), RTO 4h.
#
# OFF-HOST DESTINATION: GitHub Actions artifacts (7-day retention, 500 MB limit).
# Cloudflare R2 was removed 2026-09-14. The owner must download artifacts to
# local storage for longer retention. See docs/backup-and-recovery.md §3.
#
# CI-minutes note: this consumes the same 2,000 min/month budget as the build
# pipeline, so it is kept deliberately tiny — a single SSH pull and an upload,
# typically well under a minute.

name: Backup database + media

on:
  schedule:
    # 19:00 UTC = 01:00 Asia/Dhaka — quietest editorial hour.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-and-upload:
    name: Dump SQLite + media → GitHub Actions artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DIANAHOST_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key so a MITM cannot silently capture the archive.
          ssh-keyscan -H "${{ secrets.DIANAHOST_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Dump the database over SSH
        # `.backup` is used instead of a plain file copy: it is safe to run while
        # the CMS is live, whereas copying a WAL-mode SQLite file can capture a
        # torn state.
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.DIANAHOST_SSH_USER }}@${{ secrets.DIANAHOST_SSH_HOST }}" \
              "sqlite3 '${{ secrets.DIANAHOST_APP_PATH }}/data/payload.db' \".backup '/tmp/payload-${STAMP}.db'\""
          scp -i ~/.ssh/id_ed25519 \
              "${{ secrets.DIANAHOST_SSH_USER }}@${{ secrets.DIANAHOST_SSH_HOST }}:/tmp/payload-${STAMP}.db" \
              "./payload-${STAMP}.db"
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.DIANAHOST_SSH_USER }}@${{ secrets.DIANAHOST_SSH_HOST }}" \
              "rm -f /tmp/payload-${STAMP}.db"
          ls -lh "./payload-${STAMP}.db"

      - name: Verify the dump is a readable SQLite database
        # A dump that cannot be opened is not a backup. Fail loudly here rather
        # than discovering it during a restore.
        run: |
          set -euo pipefail
          FILE=$(ls payload-*.db | head -1)
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          sqlite3 "$FILE" "PRAGMA integrity_check;" | tee /tmp/integrity.txt
          grep -q '^ok$' /tmp/integrity.txt

      - name: Tar the media directory
        # docs/backup-and-recovery.md §6: "The backup must include data/media/,
        # not just the SQLite file." Media moved to the host disk in S9.
        # If the media directory is empty or missing, the tar still succeeds
        # (empty archive) — the database is the critical asset.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.DIANAHOST_SSH_USER }}@${{ secrets.DIANAHOST_SSH_HOST }}" \
              "cd '${{ secrets.DIANAHOST_APP_PATH }}/data' && tar cf /tmp/media-${STAMP}.tar media/ 2>/dev/null || tar cf /tmp/media-${STAMP}.tar --files-from=/dev/null"
          scp -i ~/.ssh/id_ed25519 \
              "${{ secrets.DIANAHOST_SSH_USER }}@${{ secrets.DIANAHOST_SSH_HOST }}:/tmp/media-${STAMP}.tar" \
              "./media-${STAMP}.tar"
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.DIANAHOST_SSH_USER }}@${{ secrets.DIANAHOST_SSH_HOST }}" \
              "rm -f /tmp/media-${STAMP}.tar"
          ls -lh "./media-${STAMP}.tar"

      - name: Check total size against 500 MB artifact limit
        # GitHub Actions free-tier artifacts are capped at 500 MB. If the DB +
        # media tar exceed this, the artifact upload will fail. Warn early.
        run: |
          set -euo pipefail
          DB_KB=$(du -sk payload-*.db | cut -f1)
          MEDIA_KB=$(du -sk media-*.tar | cut -f1)
          TOTAL_KB=$((DB_KB + MEDIA_KB))
          TOTAL_MB=$((TOTAL_KB / 1024))
          echo "DB: ${DB_KB} KB, Media: ${MEDIA_KB} KB, Total: ${TOTAL_MB} MB"
          if [ "$TOTAL_KB" -gt 512000 ]; then
            echo "::warning::Backup total (${TOTAL_MB} MB) exceeds the 500 MB artifact limit. The upload may fail. Consider splitting the media tar or excluding media from the daily dump."
          fi

      - name: Upload backup as GitHub Actions artifact
        # 7-day retention per GitHub Actions free tier. The owner must download
        # artifacts to local storage for longer retention.
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ env.STAMP }}
          path: |
            payload-*.db
            media-*.tar
          retention-days: 7

      - name: Alert on failure
        # docs/backup-and-recovery.md §7: alert if the daily dump fails or has
        # not run in 48 hours. GitHub notifies on a failed scheduled run; the
        # 48-hour silence case needs the uptime monitor (docs/reliability.md §6).
        if: failure()
        run: |
          echo "::error::Daily database + media backup FAILED — the archive is unprotected. Investigate immediately."
          echo "::error::Check SSH connectivity, DianaHost account status, and disk space."
