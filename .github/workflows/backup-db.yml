# Shikkha24 — daily off-host backup of the database + media library
#
# Source: docs/backup-and-recovery.md §3 (tier 1) and §6.
#
# WHY THIS IS CRITICAL: the ENTIRE editorial archive — every article, every education
# record, every reader account — lives in ONE SQLite file on a 2 GB shared hosting
# account. Losing it ends the business. There is no redundancy.
#
# ## What changed, and why the previous version could never work
#
# The old workflow pulled the dump with `ssh` and `scp`. **This host has no SSH** —
# ports 22, 2222, 222, 2200 and 2022 all reject. It failed 6 runs out of 6.
#
# The replacement is FTPS. `docs/hosting-and-deployment.md` recorded "only 443, 2083 and
# 2087 are open"; that was wrong — **port 21 is open** and answers as Pure-FTPd with TLS.
# FTP is the only transport on this host that can move a binary file out without a shell.
#
# ## The split, and why it is a split
#
#   ON THE HOST   cPanel cron runs scripts/host-backup-dump.sh, which uses SQLite's own
#                 online backup API (`.backup`) to take a consistent snapshot while the
#                 CMS is serving traffic, and tars it with the media library.
#   IN CI         this workflow fetches that one archive and refuses to store anything it
#                 cannot prove is restorable.
#
# Neither half can do the other's job: FTP cannot run `sqlite3`, and an HTTP client
# cannot produce a consistent snapshot of a database being written to.
#
# ## ⚠️ Three ways this can lie to you, and how each is prevented
#
#   1. The host cron silently stops running. The fetch would keep succeeding on an old
#      archive forever — a green run and no backup. **Prevented by a staleness check:**
#      an archive older than 30 hours fails the run with a message naming cPanel's cron
#      page. (`scripts/backup-fetch.mjs`, MAX_AGE_HOURS.)
#   2. The archive is truncated in transit. **Prevented by `PRAGMA integrity_check`**
#      plus a full extract test before anything is stored. (`scripts/backup-verify.mjs`.)
#   3. The archive is missing the media library, so every image is gone but the database
#      looks healthy. **Prevented by refusing an archive with no media/** — the failure
#      docs/backup-and-recovery.md §7 calls "worse than no backup, because it hides the
#      gap".
#
# ## SETUP — the owner must do this once
#
# 1. cPanel → **FTP Accounts** → create an account whose Directory is
#    `/home/shikkhac/shikkha24-backup`. Use a *dedicated* password, not the main account
#    password: this credential's only job is to read backups, and it must not be able to
#    reach `.env`. Give it **no privileges** (FTP accounts do not need them here).
# 2. cPanel → **File Manager** → `/home/shikkhac` → make a folder `bin` → upload
#    scripts/host-backup-dump.sh into it, renamed to shikkha24-backup-dump.sh.
#    Then cPanel → **Terminal**:
#        mkdir -p ~/bin ~/shikkha24-backup
#        chmod +x ~/bin/shikkha24-backup-dump.sh
#        ~/bin/shikkha24-backup-dump.sh
#    ⚠️ There is no `cp` line because there is no SSH to this host — the file has to
#    arrive through File Manager. A `cp` left as a comment here gets pasted, appears to
#    run, and silently does nothing.
#    ⚠️ Run it by hand and READ the output. A good run ends "done — N archive(s) retained".
#    If it fails, cron will fail 30 times a month and nothing will look wrong until the
#    day it is needed. If it says sqlite3 is missing, install it — do NOT fall back to cp.
# 3. cPanel → **Cron Jobs** → once daily at **23:00 SERVER-LOCAL time**:
#        0  23  *  *  *   /bin/sh /home/shikkhac/bin/shikkha24-backup-dump.sh
#    ⚠️ That hour is not a guess. cPanel schedules in the account's local time and this
#    account is **Asia/Dhaka (UTC+6)** — measured: the host's FTP banner read
#    "Local time is now 18:19" at 12:19 UTC. So 23:00 local = 17:00 UTC, two hours
#    before this workflow's 19:00 UTC fetch. Run the dump AFTER the fetch and CI keeps
#    picking up yesterday's archive, which still passes the staleness check — so
#    nothing goes red and a day of freshness is lost every cycle, silently.
# 4. GitHub → **Settings → Secrets and variables → Actions → Secrets**: FTP_HOST,
#    FTP_USER, FTP_PASSWORD.
#
# ⚠️ Never put FTP_PASSWORD in a commit, an issue, or chat. If it is exposed, delete the
# FTP account in cPanel and create a new one.
#
# ## ⚠️ Artifacts are not archival storage
#
# GitHub Actions artifacts expire, and the storage quota on a private repository is not
# documented anywhere I could verify (docs.github.com returned 404 for every attempt —
# this is an assumption, not a fact). Retention is therefore set to 30 days and the job
# warns as the archive grows. **Download the artifact and keep it somewhere else.** The
# copy that matters is the one you have moved.

name: Backup database + media

on:
  schedule:
    # 19:00 UTC = 01:00 Asia/Dhaka — quietest editorial hour.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Fetch + verify the host backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ⚠️ DISABLED (pentest 2026-10-29, H5). This repo is PUBLIC, and this job
    # uploads the full database dump (reader password hashes, newsletter
    # subscribers, comments) as a workflow ARTIFACT — downloadable by anyone on
    # a public repo. It also targets the RETIRED DianaHost SQLite database;
    # production is Neon Postgres since 2026-10-28, so a "successful" run would
    # back up the wrong database anyway. The replacement is
    # `backup-neon.yml`: pg_dump straight into the PRIVATE R2 backup bucket,
    # never a GitHub artifact. Re-enable nothing here without reading
    # docs/security-audit-2026-10-29.md H5 first.
    if: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify the backup verifier still works
        # ⚠️ Runs here, not only in `pnpm verify`. This job's entire output is a decision
        # made by backup-verify.mjs; a gate that quietly stopped rejecting bad input
        # would let a week of green runs mean nothing. It costs seconds and no pnpm
        # install — these scripts have no dependencies.
        run: node scripts/verify-backup.mjs

      - name: Fetch the newest archive over FTPS and verify it
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/backup-fetch.mjs .

      - name: Store the verified archive
        # ⚠️ No `if: always()` here, and the reason is not tidiness.
        #
        # `if: always()` was here with a comment claiming "the file is already verified at
        # this point, so storing it is safe". **That was false.** When the verifier rejects
        # an archive, `backup-fetch.mjs` throws, this step's *predecessor* fails — and
        # `always()` overrode that, uploading the exact file that had just been rejected.
        # It landed under a normal-looking name: `shikkha24-backup-<run_id>`. At 3am, during
        # a restore, that is the file a tired person grabs first.
        #
        # Default gating (`success()`) is the correct behaviour: an archive is stored only
        # when something said it was restorable.
        uses: actions/upload-artifact@v7
        with:
          name: shikkha24-backup-${{ github.run_id }}
          path: shikkha24-*.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Warn about size
        if: always()
        run: |
          set -euo pipefail
          FILE=$(ls -1 shikkha24-*.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "$FILE" ]; then
            echo "::warning::No archive was produced — there is nothing to store."
            exit 0
          fi
          MB=$(( $(stat -c %s "$FILE") / 1024 / 1024 ))
          echo "Archive: ${MB} MB"
          # Reported rather than asserted. The quota on a private repository could not be
          # verified from GitHub's documentation, so this is a prompt to go and look, not
          # a claim about a limit.
          if [ "$MB" -gt 100 ]; then
            echo "::warning::Archive is ${MB} MB. Confirm this repository's artifact storage quota — a quota breach stops the *upload*, not this workflow, so the failure would be easy to miss."
          fi

      - name: Alert on failure
        # docs/backup-and-recovery.md §7: alert if the daily dump fails or has not run
        # in 48 hours. GitHub notifies on a failed scheduled run; the staleness check in
        # backup-fetch.mjs is what covers the "did not run" case.
        if: failure()
        run: |
          echo "::error::Daily database + media backup FAILED — the editorial archive is unprotected."
          echo "::error::Diagnose in this order: (1) does cPanel → Cron Jobs list the job, and did it pass? (2) run ~/bin/shikkha24-backup-dump.sh by hand and read the error. (3) if the fetch failed, check the FTP account and the FTP_* secrets."