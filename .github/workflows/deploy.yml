# Shikkha24 — deploy workflow
#
# ## What this deploys
#
#   1. The Astro static build → `public_html` on DianaHost
#   2. The Payload CMS standalone bundle → `~/shikkha24-cms` (only when asked)
#
# ## Why the transport is the cPanel API and not SSH
#
# The previous version of this file ended in `rsync --delete … -e "ssh -i …"` and
# `scp`. **The host refuses SSH** — ports 22, 2222, 222, 2200 and 2022 all reject.
# (Port 21/FTPS *is* open, but that moves files and cannot run a build; it is what
# the backup uses, not this. See `docs/hosting-and-deployment.md` §0.) That workflow
# could never have deployed anything, and every deploy since was done by hand
# through cPanel File Manager.
#
# The replacement is the cPanel HTTPS API. Authentication is a static token in one
# plain header (`Authorization: cpanel <user>:<token>`) — not OAuth, no exchange,
# no expiry. See `docs/hosting-and-deployment.md` §4.2.
#
# ## Dry run is the default
#
# `mode` defaults to `dry-run`. A dry run builds, verifies, prints the exact
# plan — including every path that would be deleted — and contacts the host for
# nothing but a directory listing. Going live requires passing `mode: live`,
# which is a deliberate act, not the path of least resistance.
#
# The CMS half additionally refuses to go live unless `confirm-risk: true`,
# because extracting over the app directory can disturb the CloudLinux venv
# symlinks in `node_modules` and take the editorial workflow down with it.
#
# ## Automatic deploys are off until you turn them on
#
# Two things fire on their own: a **push to main**, and `repository_dispatch`
# (the CMS publish webhook, when an editor clicks Publish). Both run in **dry
# run** unless the repository variable `AUTO_DEPLOY` is set to `live`. Until you
# flip that one setting, every automatic trigger rebuilds, verifies, and prints
# the plan — including every path it would delete — without touching the host.
#
# Set `AUTO_DEPLOY=live` and a push to main publishes the frontend by itself.
# The CMS half stays manual either way; see the `push` branch in "Resolve mode
# and target" for why.
#
# SECRETS REQUIRED (GitHub → Settings → Secrets and variables → Actions):
#   CMS_URL             — build-time CMS origin the build fetches content from
#   PUBLIC_CMS_ORIGIN   — browser-facing origin for interactive islands; must
#                         match the CSP `connect-src` in `.htaccess`
#   CPANEL_HOST         — e.g. b201.serverdiana.com
#   CPANEL_USER         — cPanel username
#   CPANEL_TOKEN        — cPanel → Security → API Tokens
#
# VARIABLES (optional):
#   AUTO_DEPLOY=live    — let the publish webhook deploy instead of only planning
#
# ⚠️ Never paste CPANEL_TOKEN into a commit, an issue, or chat. If it is exposed,
# delete it in cPanel and create a new one.

name: Deploy

on:
  # ⚠️ The "ship it" push trigger moved to deploy-cloudflare.yml (T-18 P1,
  # 2026-10-15). THIS workflow is triggered **manually only** now.
  #
  # Why push was removed: pushing to main once ran THIS workflow *and* the
  # Cloudflare workflow, doubling every frontend build (a private-repo minutes
  # problem at publishing velocity), and worse — with the repository variable
  # AUTO_DEPLOY set to `live`, the resolve-mode step below would have attempted
  # a LIVE cPanel deploy on every push to a host that cannot extract (T-15).
  # The publish-on-push invariant is asserted by scripts/verify-cloudflare.mjs.
  #
  # Rollback to cPanel stays possible: workflow_dispatch, mode=live
  # target=static — while the domain's DNS still points at DianaHost.

  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this deploy was triggered'
        required: false
        default: 'manual'
      mode:
        description: 'dry-run plans and verifies; live pushes to production'
        required: false
        default: 'dry-run'
        type: choice
        options: [dry-run, live]
      target:
        description: 'Which half to build and deploy'
        required: false
        default: 'all'
        type: choice
        options: [all, static, cms]
      confirm-risk:
        description: 'Confirm the CMS deploy may disturb node_modules (required for target=all/cms + live)'
        required: false
        default: false
        type: boolean
      cms-root:
        description: 'Host directory for the CMS. Leave empty for shikkha24-cms; set shikkha24-cms-staging to rehearse a first live run without touching production'
        required: false
        type: string
      cms-url:
        description: 'Origin the CMS deploy verifies after transferring. REQUIRED whenever cms-root is set — otherwise the post-deploy check probes production and passes without testing the rehearsal'
        required: false
        type: string
      skip-ci-gate:
        description: 'Deploy without waiting for CI (manual runs only — a push can never bypass it)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  # A publish burst debounces to one build; cancelling a superseded one keeps
  # the 2,000 min/month budget. The live deploy always completes — the group is
  # per-ref and only a newer run cancels a *pending* one.
  cancel-in-progress: true

permissions:
  contents: read
  # Required by the CI gate below, which lists this repo's CI runs through the
  # Actions API. Without it the token is limited to `contents: read` and every
  # poll returns 403 — which the gate now fails on immediately rather than
  # retrying, but the real fix is the grant.
  actions: read

jobs:
  deploy:
    name: Build + deploy to DianaHost
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # ── CI gate ───────────────────────────────────────────────────────────
      # Deliberately the FIRST thing after the checkout, and before `pnpm install`.
      # The failure it prevents is specific and recent: on 2026-10-11 two builds
      # reached the host carrying code that did not do what it claimed — the image
      # optimiser was inert because the import map had never been regenerated, and
      # removing `imageSizes` changed the schema with no migration committed. Both
      # gaps now have their own gates, so the next occurrence is stopped — but only
      # after the deploy that carried it. This is the gate that stops that deploy.
      #
      # It needs the repository (the script) and Node, both available here, but no
      # dependencies — so a red tree costs seconds instead of a full install and
      # build. Anything that builds or transfers must sit below this line.
      #
      # `skip-ci-gate` exists because CI is currently red on the dependency audit
      # alone (T-10, Payload 3.90.2) and a strict gate would freeze every CMS
      # deploy until that lands. It is deliberately dispatch-only: a push can
      # never bypass this, so automatic publishing always respects CI and only a
      # human can override it, loudly and on the record.
      - name: Wait for CI to pass
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip-ci-gate) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GATE_TIMEOUT_MS: ${{ vars.CI_GATE_TIMEOUT_MS || '900000' }}
        run: node scripts/wait-for-ci.mjs

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CI gate overridden
        # Reached only via workflow_dispatch with skip-ci-gate=true.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip-ci-gate }}
        run: |
          echo "::warning::CI GATE OVERRIDDEN — deploying ${{ github.sha }} with an unverified tree."
          echo "::warning::This deploy is NOT covered by CI. Confirm the failure is unrelated to what you are shipping."

      # ── Resolve the effective mode ────────────────────────────────────────
      - name: Resolve mode and target
        id: cfg
        env:
          # An explicit input wins. A webhook has no input, so it falls back to
          # the AUTO_DEPLOY variable — which defaults to planning only.
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_CONFIRM: ${{ inputs.confirm-risk }}
          INPUT_CMS_ROOT: ${{ inputs.cms-root }}
          INPUT_CMS_URL: ${{ inputs.cms-url }}
          PAYLOAD_REASON: ${{ github.event.client_payload.reason }}
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "repository_dispatch" ]; then
            MODE="${AUTO_DEPLOY:-dry-run}"
            TARGET="static"
            REASON="${PAYLOAD_REASON:-publish}"
            CONFIRM="false"
          elif [ "$EVENT" = "push" ]; then
            # ⚠️ A push deploys the FRONTEND ONLY, and never without AUTO_DEPLOY.
            #
            # Frontend = finished HTML dropped into public_html. Idempotent, and a
            # bad build is replaced by the next one — safe to do unattended.
            #
            # The CMS half is deliberately NOT automatic. Its bundle is extracted
            # over `~/shikkha24-cms`, which can disturb the CloudLinux venv
            # symlinks in node_modules and take /admin down with nobody awake to
            # fix it. That stays behind workflow_dispatch + confirm-risk.
            #
            # ⚠️ This branch had no coverage when it was added. A gate that only
            # ever exercises the paths it knows about is the exact defect that let
            # the first three deploy bugs through, so `verify-deploy-mode.mjs`
            # asserts this whole branch — including that push CANNOT reach the CMS.
            MODE="${AUTO_DEPLOY:-dry-run}"
            TARGET="static"
            REASON="push"
            CONFIRM="false"
          else
            MODE="$INPUT_MODE"
            TARGET="$INPUT_TARGET"
            REASON="$INPUT_REASON"
            CONFIRM="$INPUT_CONFIRM"
          fi

          # ⚠️ Normalise BEFORE anything compares MODE.
          #
          # `AUTO_DEPLOY` is a free-text repository variable, and MODE was used
          # verbatim by two independent comparisons: `[ "$MODE" = "live" ]` gates
          # the confirm-risk check, and `mode == 'dry-run'` decides
          # DEPLOY_DRY_RUN. Setting AUTO_DEPLOY to `Live` made the first false —
          # skipping the gate — and the second false too, so a deploy nobody
          # confirmed went live. Two comparisons reading the same string in
          # opposite senses is the whole bug: normalise once, then compare once.
          MODE=$(printf '%s' "$MODE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          case "$MODE" in
            live|dry-run) ;;
            *)
              echo "::error::Unrecognised mode '$MODE'. Use 'live' or 'dry-run'. (AUTO_DEPLOY is set to '${AUTO_DEPLOY:-<unset>}' — it accepts 'live' or 'dry-run'.)"
              exit 1
              ;;
          esac

          case "$TARGET" in
            all|static|cms) ;;
            *)
              echo "::error::Unrecognised target '$TARGET'. Use 'all', 'static' or 'cms'."
              exit 1
              ;;
          esac

          # ⚠️ SECURITY: `confirm-risk` is compared below with `!= "true"`, which
          # is a NEGATIVE test — and a negative test on free text is fail-OPEN.
          # `confirm-risk` is declared `type: boolean`, but GitHub offers no
          # mechanism that stops the broader value set from arriving here: a
          # dispatch made through `POST /repos/…/dispatches` carries the input
          # map verbatim with no schema validation at all. Any value other than
          # the exact string `true` — including the string `yes`, which an
          # operator would reasonably read as confirmation — therefore satisfies
          # `!= "true"` and REFUSES the deploy, while a value that IS `true` is
          # the only thing that can authorise the live CMS write. So allow-list
          # it positively: `true`/`false`, exact, nothing else.
          case "$CONFIRM" in
            true|false) ;;
            *)
              echo "::error::Unrecognised confirm-risk '$CONFIRM'. Use 'true' or 'false'."
              exit 1
              ;;
          esac

          # Emitted as a boolean so no downstream step re-derives it from the
          # string. This is the value that decides whether the host is mutated.
          if [ "$MODE" = "live" ]; then DRY_RUN=false; else DRY_RUN=true; fi

          # ⚠️ SECURITY (T-62) — every untrusted value must be constrained, not
          # merely interpolated, and must ROUND-TRIP through its output record.
          #
          # `REASON` is attacker-influenced text: on `workflow_dispatch` it is
          # the free-text `reason` input, and on `repository_dispatch` it is
          # `client_payload.reason`, which any actor holding a token with the
          # `repo` scope can set to anything at all. This block draws the
          # boundary. `$GITHUB_OUTPUT` is a RECORD-ORIENTED file: one
          # `name=value` record per line, and a `name<<DELIM … DELIM` block.
          # Writing bare `echo "reason=$REASON"` therefore let the value forge
          # records of its own — a newline in the reason turned one write into
          # `target=cms`, `dry_run=false`, or any other output the workflow
          # later trusts, so a value that only ever reaches a log line could
          # silently redirect the deploy at the CMS or take it out of dry run.
          #
          # Four independent defences, because any one of them alone is a single
          # point of failure on the one boundary that decides whether production
          # is mutated:
          #
          #   1. `tr -d '[:space:]'` removes newline, carriage return, tab and
          #      space — the exact characters that end a record or a heredoc
          #      line. (POSIX `[:space:]`; verified with `od` that CR survives
          #      nothing.) Validation then runs on the stripped value, so
          #      "live \n" cannot pass a `case` and still carry the newline.
          #   2. Strip again after validation — never carry the original raw
          #      value forward. The value written is the value that was checked,
          #      so "passes the allow-list" and "is what the deploy reads" cannot
          #      be two different strings.
          #   3. A heredoc whose delimiter carries a per-run random suffix.
          #      GitHub strips the trailing newline and parses the value from
          #      the matched delimiter lines, so a value that itself looks like
          #      an output record is inert data. The random suffix is what stops
          #      a crafted value from containing the delimiter and closing the
          #      heredoc early — the failure mode of a fixed `EOF`. No name in
          #      this workflow begins with `EOF`, so the old body-writing form
          #      (`{\n echo k=v\n} >>`) has no way left to start a heredoc.
          #   4. Round-trip assert: read the value straight back out of the file
          #      we just wrote and require an exact match. If any of the above
          #      were ever weakened, the deploy dies HERE, on the line that would
          #      have written the forged record, instead of shipping it.
          REASON=$(printf '%s' "$REASON" | tr -d '[:space:]')
          # `:-` on every read below: an empty reason is legitimate (the input is
          # `required: false`) and MUST NOT be `unset`. Under `set -u` an unset
          # variable makes the `echo "reason: …"` further down — and every read
          # after it — die with "REASON: unbound variable", turning a perfectly
          # valid confirmation into a failed deploy.
          REASON=$(printf '%s' "${REASON:-}")

          # `mode` and `target` were ALREADY allow-listed by the `case` blocks
          # above, so they cannot carry a newline; they are normalised below only
          # so that the shape of the file is uniform and a future edit cannot
          # reintroduce a bare write for one of the four. `MODE` and `TARGET` can
          # never be empty here (the `case` rejects an empty value), and `DRY_RUN`
          # is always assigned — so all three are simply given the shape the
          # writer expects and never unset.
          MODE=$(printf '%s' "${MODE:-}")
          DRY_RUN=$(printf '%s' "${DRY_RUN:-}")
          TARGET=$(printf '%s' "${TARGET:-}")

          # ⚠️ Uniquely named delimiter, NOT a fixed `EOF`. The whole injection
          # is "the value can contain a line that ends the block"; a random
          # suffix per run makes that line unguessable, and the same seed is
          # shared by the write and the read-back so the round-trip is meaningful.
          DELIM="EOF_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            echo "mode<<$DELIM";    printf '%s' "${MODE-}";    printf '\n%s\n' "$DELIM"
            echo "dry_run<<$DELIM"; printf '%s' "${DRY_RUN-}"; printf '\n%s\n' "$DELIM"
            echo "target<<$DELIM";  printf '%s' "${TARGET-}";  printf '\n%s\n' "$DELIM"
            echo "reason<<$DELIM";  printf '%s' "${REASON-}";  printf '\n%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

          # The round-trip ASSERTION is deliberately located directly beneath
          # the write, so a diff cannot separate them. Behaviour is unchanged
          # for a legitimate value: the comparison simply passes.
          #
          # The read below reimplements GitHub's own parse rule for this file,
          # because the write is now a heredoc and a `k=v` reader would find
          # nothing, compare '' against the value and fail every run. The rule:
          # a `name=value` line takes the first line, and a `name<<DELIM` opener
          # takes the lines up to the delimiter that closes the block last (a
          # crafted value cannot close it early, because the delimiter is random
          # and GitHub — as below — matches the last one). An output may be set
          # only once, so the last assignment of a name is the one that stands.
          read_output() {
            local want="$1" line d="" inblock=0 v="" last="" rest=""
            while IFS= read -r line; do
              if [ "$inblock" = "1" ]; then
                if [ "$line" = "$d" ]; then v="$last"; inblock=0; else last="$line"; fi
                continue
              fi
              # ⚠️ The operator is compared AFTER the name is stripped. Writing
              # the heredoc case as `"$want"<` + `<*` puts two adjacent '<'
              # characters after a variable expansion, which bash's parser reads
              # as a HEREDOC — the step dies with "syntax error near unexpected
              # token `<<'" before a single line runs. Splitting name from
              # operator avoids that entirely and keeps '=' and the opener in
              # one place.
              case "$line" in
                "$want"*)
                  rest="${line#"$want"}"
                  case "$rest" in
                    '='*)
                      v="${rest#=}"
                      ;;
                    '<<'*)
                      d="${rest#<<}"
                      # ⚠️ An empty delimiter would match the value's own last
                      # line and let a block close early, which is the whole
                      # attack. No writer here can produce one, so it is invalid.
                      case "$d" in
                        ''|*[!A-Za-z0-9_]*) : ;;
                        *) inblock=1; last="" ;;
                      esac
                      ;;
                  esac
                  ;;
              esac
            done < "$GITHUB_OUTPUT"
            printf '%s' "$v"
          }

          for pair in mode:"${MODE-}" dry_run:"${DRY_RUN-}" target:"${TARGET-}" reason:"${REASON-}"; do
            k="${pair%%:*}"
            v="${pair#*:}"
            got=$(read_output "$k")
            if [ "$got" != "$v" ]; then
              echo "::error::Unsafe output boundary: '$k' did not survive its own \$GITHUB_OUTPUT record. Refusing to deploy — the value may have forged additional output records."
              exit 1
            fi
          done

          echo "mode:    $MODE"
          echo "target:  $TARGET"
          echo "reason:  $REASON"

          # ⚠️ SECURITY — the confirmation gate reads the OUTPUT, not the local
          # variable. That is the other half of the audit finding, and it is
          # what makes the hardening above load-bearing rather than decorative:
          # previously the gate compared `$CONFIRM`, a local value, while every
          # deploy step below compared `steps.cfg.outputs.*`. Two readers of one
          # decision is a boundary an attacker only has to cross once, and it is
          # crossed by making the two disagree. Now there is exactly ONE source
          # — the record this step wrote and just verified — and the gate, the
          # `if:` conditions and the deploy scripts all read that same one.
          OUT_MODE=$(read_output mode)
          OUT_TARGET=$(read_output target)
          OUT_DRY_RUN=$(read_output dry_run)
          # `reason` is deliberately NOT read here: it decides nothing, and the
          # round-trip loop above has already proved it survived its record.
          # An unused variable only invites the next reader to trust it.

          # Fail loudly on a source that cannot be resolved. `set -u` already
          # refuses an unset variable, but an EMPTY one would otherwise fall
          # through every `!=` test below and land on the permissive side, which
          # is the same fail-open shape as the `confirm-risk` bug above.
          for pair in mode:"$OUT_MODE" target:"$OUT_TARGET" dry_run:"$OUT_DRY_RUN"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::Output '${pair%%:*}' is empty or unreadable after the write. Refusing to deploy on a decision that cannot be read back."
              exit 1
            fi
          done

          if [ "$OUT_MODE" = "live" ] && [ "$OUT_TARGET" != "static" ] && [ "$CONFIRM" != "true" ]; then
            echo "::error::A live CMS deploy can disturb the venv symlinks in node_modules and take the CMS down. Re-run with confirm-risk: true, or use target: static."
            exit 1
          fi

          # ⚠️ A rehearsal must verify the thing it rehearsed.
          #
          # `verifyCms()` probes `$CMS_URL/api/articles` after the transfer. Without
          # an override that is the PRODUCTION origin, so a run pointed at
          # `shikkha24-cms-staging` would transfer the bundle, extract it, probe
          # production — which is up and answers 200 — and report success without
          # having verified a single byte of the rehearsal. That is a false green,
          # which is the failure class this pipeline has produced three times now.
          #
          # So a live CMS deploy to a non-default root must name the origin it is
          # verifying. Deploying production itself is unaffected: empty cms-root
          # keeps the secret, and the probe is then correct by definition.
          if [ "$OUT_MODE" = "live" ] && [ "$OUT_TARGET" != "static" ] && [ -n "${INPUT_CMS_ROOT:-}" ] && [ -z "${INPUT_CMS_URL:-}" ]; then
            echo "::error::cms-root is '${INPUT_CMS_ROOT}', so this is a rehearsal, but cms-url is empty. The post-deploy check would probe PRODUCTION and pass without testing ${INPUT_CMS_ROOT} at all. Supply cms-url, or clear cms-root to deploy production."
            exit 1
          fi
          # Read the same validated outputs as the gate above: if this echo
          # disagrees with what the deploy steps act on, the warning is a lie.
          if [ "$OUT_MODE" = "live" ]; then
            echo "::warning::LIVE DEPLOY — this pushes to production."
          else
            echo "Dry run: the host will be listed and planned, but nothing will be changed."
          fi

      # ── Build the frontend ───────────────────────────────────────────────
      - name: Astro sync (generate content + env types)
        run: pnpm --filter @shikkha24/frontend exec astro sync

      - name: Build (frontend)
        env:
          # ⚠️ Three CMS-host values, and the build needs all three:
          #
          #   CMS_URL          — read at BUILD time; every article, category and
          #                      setting is fetched from here and baked into the
          #                      static HTML. Unset or unreachable, the build
          #                      still exits 0 but emits a fraction of the pages
          #                      ("thin build"). The harnesses below are the guard.
          #
          #   PUBLIC_CMS_ORIGIN — browser-facing origin for the interactive
          #                      islands. Empty means those controls self-hide.
          #
          #   PUBLIC_MEDIA_BASE_URL — prefixes the CMS's relative
          #                      `/api/media/file/…` path. **Unset, every article
          #                      image 404s** — the static host serves no `/api/`.
          CMS_URL: ${{ secrets.CMS_URL }}
          PUBLIC_CMS_ORIGIN: ${{ secrets.PUBLIC_CMS_ORIGIN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://shikkha24.com' }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL || 'https://cms.shikkha24.com' }}
        run: pnpm run build:frontend

      # ── Verify, before anything is transferred ───────────────────────────
      - name: Verify .htaccess against a real Apache
        run: |
          set -euo pipefail
          if ! command -v apache2 >/dev/null && [ ! -x /usr/sbin/apache2 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq apache2
          fi
          pnpm run verify:apache

      - name: Verify build output (thin-build guard)
        # ⚠️ Must run before any delete. A CMS outage at rebuild time does not
        # fail the Astro build (`lib/cms.ts` is deliberately built so it cannot),
        # so without this the manifest would mark every article stale and the
        # deploy would remove the whole live site, and Google would re-index it.
        env:
          CMS_URL: ${{ secrets.CMS_URL }}
        run: pnpm run verify:build-output

      - name: Verify internal links
        run: pnpm run verify:links

      - name: Verify search bootstrap
        run: pnpm run verify:search-init

      - name: Verify the cPanel deploy path
        # The transport is new and the host has never seen it. These are the
        # checks that make a first live run plausible rather than reckless.
        run: |
          pnpm run verify:cpanel-deploy
          pnpm run verify:deploy-mode
          pnpm run verify:deploy-inputs

      # ── Build the CMS (only when it is the target) ───────────────────────
      - name: Build (CMS, standalone)
        if: ${{ steps.cfg.outputs.target == 'all' || steps.cfg.outputs.target == 'cms' }}
        run: pnpm run build:cms
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db

      - name: Assemble the standalone deploy bundle
        # Four traps, each of which reached production once. Comments carry the
        # detail; the assertions are the point — every one of these copies a
        # file the host needs and silently produces a dead deploy if it misses.
        if: ${{ steps.cfg.outputs.target == 'all' || steps.cfg.outputs.target == 'cms' }}
        run: |
          set -euo pipefail
          ROOT=cms/.next/standalone

          # 1. In a pnpm monorepo the entry point is standalone/cms/server.js,
          #    NOT standalone/server.js. Upload the wrong one and every route 500s.
          if [ ! -f "$ROOT/cms/server.js" ]; then
            echo "::error::standalone entry point missing at $ROOT/cms/server.js"
            exit 1
          fi

          # 2. Next does not copy .next/static into the bundle. Without it the
          #    admin loads and every asset 404s.
          mkdir -p "$ROOT/cms/.next/static"
          cp -R cms/.next/static/. "$ROOT/cms/.next/static/"

          # 3. The Bengali card font is not traced by Next. The ID-card
          #    endpoints read it relative to the bundle root at runtime, so
          #    /api/idcard/:id.png answers 503 instead of rendering the card.
          mkdir -p "$ROOT/cms/fonts"
          cp assets/fonts/vendor/solaimanlipi-400.woff2 assets/fonts/vendor/solaimanlipi-700.woff2 "$ROOT/cms/fonts/"

          # 4. The migrations. `payload migrate` locates them at src/migrations,
          #    dist/migrations or migrations relative to the working directory,
          #    and nothing in next.config.ts asks for it to be traced in — so
          #    relying on tracing would bet production on undocumented
          #    behaviour. Without them the host cannot build its schema at all.
          mkdir -p "$ROOT/cms/src/migrations"
          cp -R cms/src/migrations/. "$ROOT/cms/src/migrations/"
          if [ ! -f "$ROOT/cms/src/migrations/index.ts" ]; then
            echo "::error::migrations missing from the deploy bundle - the host could not build its schema"
            exit 1
          fi

          # 5. pnpm's hoisted fallback has to be reachable from the TOP level.
          #    Turbopack copies @libsql/client in as a real directory, which
          #    severs pnpm's sibling-symlink layout, so @libsql/core is no longer
          #    reachable by Node's upward resolution. On the host that is a hard
          #    boot failure (ERR_MODULE_NOT_FOUND) that dev never reproduces.
          #
          #    ⚠️ This was `cp -Rn .pnpm/node_modules/. node_modules/`, and it was
          #    wrong: those entries are symlinks whose targets are relative to
          #    their own depth, so copying the contents up one level leaves every
          #    link dangling. It failed here on 2026-10-04, the first time this
          #    step had ever run. Dereferencing is not the alternative either —
          #    224 KB of links into a store that is already present dereferences
          #    to 3.1 GB. `promote-pnpm-fallback.mjs` links the top level *back
          #    into* the fallback so pnpm's own layout keeps resolving, and exits
          #    non-zero listing anything still broken. See scripts/verify-pnpm-fallback.mjs.
          node scripts/promote-pnpm-fallback.mjs "$ROOT/node_modules"
          if [ ! -e "$ROOT/node_modules/@libsql/core" ]; then
            echo "::error::pnpm hoist not promoted - the host could not resolve @libsql/core"
            exit 1
          fi

          # 5a. A sentinel naming the commit this bundle was built from.
          #
          #     The post-deploy probe asks the *site* whether it answers 200. When
          #     the extract silently does nothing, the previous build is still
          #     running and answers 200 perfectly - so the probe reports success
          #     for a deploy that changed nothing. That is not hypothetical: it is
          #     how every CMS deploy on 2026-10-10 reported success while the host
          #     kept serving four-day-old code.
          #
          #     A commit marker turns "did it work" into "is the code on the host
          #     the code we built", which the old probe could never ask.
          #     deploy-cms.mjs reads this back and throws on a mismatch.
          printf '%s' "${GITHUB_SHA}" > "$ROOT/DEPLOYED_COMMIT"

          # 6. ⚠️ Strip the production secret and the editorial archive from the
          #    bundle before it is uploaded. `output: 'standalone'` traces
          #    `cms/.env` in byte for byte and `cms/data/` (38 MB: payload.db, 11
          #    dated backups, the media library) with it. Measured 2026-10-09.
          #
          #    `deploy-cms.mjs:assertBundleIsSafe` refuses such a bundle — correctly —
          #    which is why every CMS deploy died at its first step. Stripping here
          #    is what makes the deploy possible, and it also means the archive can
          #    never be uploaded over FTP to the host. The host supplies both at
          #    runtime; `CMS_PROTECTED` excludes them from the clear set so the live
          #    copies are never deleted or overwritten.
          #    See scripts/sanitize-cms-bundle.mjs and its counter-proofs.
          node scripts/sanitize-cms-bundle.mjs "$ROOT/cms"
          for forbidden in .env data; do
            if [ -e "$ROOT/cms/$forbidden" ]; then
              echo "::error::$forbidden still in the CMS bundle - refusing to upload a bundle carrying the secret or the archive"
              exit 1
            fi
          done

          echo "CMS bundle = $(du -sm "$ROOT/cms" | cut -f1) MB"

      # ── Deploy ───────────────────────────────────────────────────────────
      - name: Deploy the CMS to ~/shikkha24-cms
        if: ${{ steps.cfg.outputs.target == 'all' || steps.cfg.outputs.target == 'cms' }}
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          DEPLOY_DRY_RUN: ${{ steps.cfg.outputs.dry_run }}
          # ⚠️ `standalone`, NOT `standalone/cms` — measured 2026-10-10.
          #
          # `standalone/cms` holds the app, but zipping *its contents* drops them
          # at the app root, while the running app is `~/shikkha24-cms/cms/server.js`
          # (the cPanel startup file is `cms/server.js`). The deploy therefore
          # wrote one level too high: the new code sat unused at the root, `cms/`
          # kept the previous build, and the post-deploy probe answered 200 from
          # the old app. A green deploy that changed nothing that mattered.
          #
          # `standalone` is the parent, so it contains BOTH halves at once:
          #   cms/         → the app, landing exactly where the startup file looks
          #   node_modules/ → the pnpm store `promote-pnpm-fallback.mjs` just
          #                  prepared, including the `@libsql/core` link the host
          #                  cannot resolve without it
          # Zipping the child dropped the second one, which is why `stderr.log`
          # recorded ERR_MODULE_NOT_FOUND for @libsql/core on every boot.
          DEPLOY_CMS_DIST: cms/.next/standalone

          # ⚠️ The origin `verifyCms()` probes after the transfer. It must be the
          # origin of whatever `DEPLOY_CMS_ROOT` holds, or the check verifies the
          # wrong deployment. The gate in "Resolve mode and target" guarantees this
          # is never the production origin while a rehearsal is in flight.
          CMS_URL: ${{ inputs.cms-url || secrets.CMS_URL }}
          # ⚠️ Overridable so the FIRST live run can target a staging directory.
          #
          # Everything above the deploy step is proven — credentials, the host,
          # the docroot listing, the bundle. What is NOT proven is the part that
          # writes: `Fileman::extract_files` is documented as possibly absent on
          # this cPanel build, and the API 2.0 fallback extracts **in place**, with
          # no destination. If either stalls partway over `~/shikkha24-cms`, the
          # CMS is left half-extracted and the venv repair needs the cPanel
          # Terminal — which DianaHost disabled on 2026-10-04.
          #
          # So the first live run goes to `shikkha24-cms-staging`. It exercises
          # the same upload, the same extract and the same 588 files, and if the
          # fork limit is still active we find out there instead of in production.
          # The default is unchanged; only an explicit override redirects.
          DEPLOY_CMS_ROOT: ${{ inputs.cms-root || vars.DEPLOY_CMS_ROOT }}
        run: node scripts/deploy-cms.mjs

      - name: Deploy the static site to public_html
        if: ${{ steps.cfg.outputs.target == 'all' || steps.cfg.outputs.target == 'static' }}
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          DEPLOY_DRY_RUN: ${{ steps.cfg.outputs.dry_run }}
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://shikkha24.com' }}
        run: node scripts/deploy-static.mjs

      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
          TARGET: ${{ steps.cfg.outputs.target }}
          REASON: ${{ steps.cfg.outputs.reason }}
        run: |
          {
            echo '## Deploy summary'
            echo ''
            echo "- **Reason:** $REASON"
            echo "- **Target:** $TARGET"
            echo "- **Mode:** $MODE"
            echo "- **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- **Status:** ${{ job.status }}"
            if [ "$MODE" = "dry-run" ]; then
              echo ''
              echo 'Nothing was changed on the host. Re-run with `mode: live` to apply this plan.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
