# Shikkha24 — continuous integration
#
# Why CI exists at all: editors only ever use the Payload admin panel; they never
# touch GitHub. Publishing fires a webhook and CI turns a publish into static
# HTML. Full explanation: docs/hosting-and-deployment.md §1.
#
# ⚠️ THIS WORKFLOW IS THE VERIFICATION PATH. S0's build/typecheck/lint evidence
# could not be produced locally — `npm install` is denied by the build
# environment's filesystem broker (see .sps/handoff.md → "S0 blocker"). The owner
# elected to defer verification to CI, so this file has never been executed.
# Expect to iterate on it during the first run.
#
# CI-MINUTES BUDGET (agent rule 7 + docs/hosting-and-deployment.md §2):
# the repository is private, so GitHub Actions is capped at 2,000 minutes/month.
# Cloudflare Pages is capped at 500 builds/month — the tighter of the two. So:
#   - this runs on pull requests and on `main`, NEVER per publish
#   - everything runs in ONE job so the install happens once, not three times
#   - publish-triggered rebuilds are adaptively batched (separate deploy workflow)
#
# Node 24 per .sps/plan.md. Astro 7 / Vite 8 cannot run on DianaHost's Node
# 20.18.2, so this is the ONLY place the frontend is ever built.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` needs a committed lockfile. The lockfile could not be generated
      # locally (the install was blocked), so on the first run this falls back to
      # `npm install` and warns loudly. `docs/security.md` §9 requires a
      # committed lockfile, so commit the generated one and this warning goes away.
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json is missing — falling back to 'npm install'. Commit the generated lockfile (docs/security.md §9) to restore reproducible installs."
            npm install --no-audit --no-fund
          fi

      - name: Lint
        # One Biome invocation over the whole repo — biome.json lives at the root
        # and its `files.includes` patterns are resolved relative to it.
        run: npm run lint

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Astro sync (generate content + env types)
        # `astro sync` writes .astro/types.d.ts, which tsconfig.json includes.
        # Running it first stops the typecheck failing on missing generated types.
        run: npm run astro -w frontend -- sync

      - name: Typecheck (frontend)
        # `tsc --noEmit`, not `astro check`: @astrojs/check rejects TypeScript 7
        # (peer range ^5 || ^6). Consequence: .astro templates are NOT
        # type-checked. See .sps/handoff.md item 41.
        run: npm run typecheck -w frontend

      - name: Build (frontend)
        run: npm run build -w frontend

      - name: Byte budget — build output
        # Coarse guard for docs/performance-budget.md §3. The real 1.2 MB target is
        # a per-page measurement and belongs to Lighthouse CI (wired at S3+, when
        # real page templates exist — asserting it against the S0 placeholder
        # would prove nothing).
        run: |
          set -euo pipefail
          kb=$(du -sk frontend/dist | cut -f1)
          echo "frontend/dist = ${kb} KB"
          if [ "$kb" -gt 12288 ]; then
            echo "::error::frontend/dist exceeds the 1.2 MB budget"
            exit 1
          fi

      - name: Upload frontend build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      # ── CMS ─────────────────────────────────────────────────────────────────
      - name: Generate Payload types and import map
        # Both are build inputs that are git-ignored. Regenerating them in CI keeps
        # the committed schema as the single source of truth.
        run: |
          set -euo pipefail
          npm run generate:types -w cms
          npm run generate:importmap -w cms
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db

      - name: Build (CMS, standalone)
        # `next build` performs its own type checking, so a type error fails here.
        run: npm run build -w cms
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db

      - name: Typecheck (CMS)
        # Runs AFTER the build on purpose: `next build` writes .next/types, which
        # tsconfig.json includes. Running this first would fail on missing files.
        run: npm run typecheck -w cms

      - name: Measure standalone deploy size
        # S0 gate: must land ≈300–600 MB to fit the 2 GB DianaHost plan.
        run: |
          set -euo pipefail
          if [ ! -d cms/.next/standalone ]; then
            echo "::error::Next.js standalone output missing — check output:'standalone' in cms/next.config.ts"
            exit 1
          fi
          mb=$(du -sm cms/.next/standalone | cut -f1)
          echo "cms/.next/standalone = ${mb} MB (target 300-600 MB)"
          if [ "$mb" -gt 700 ]; then
            echo "::error::standalone bundle exceeds 700 MB and will not fit the 2 GB host"
            exit 1
          fi

      # ── Supply chain ────────────────────────────────────────────────────────
      - name: Dependency audit
        # Policy: docs/security.md §9 — high and critical block the build.
        run: npm audit --audit-level=high

      # ── Deliberately not yet wired ──────────────────────────────────────────
      # Lighthouse CI, broken-link check and JSON-LD validation need real page
      # templates. They are wired at S3+ per docs/testing-and-qa.md §1. Running
      # them against the S0 placeholder would assert nothing.
