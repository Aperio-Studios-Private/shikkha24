# Shikkha24 — continuous integration
#
# Why CI exists at all: editors only ever use the Payload admin panel; they never
# touch GitHub. Publishing fires a webhook and CI turns a publish into static
# HTML. Full explanation: docs/hosting-and-deployment.md §1.
#
# CI-MINUTES BUDGET (agent rule 7 + docs/hosting-and-deployment.md §2):
# the repository is private, so GitHub Actions is capped at 2,000 minutes/month.
# There is no Cloudflare Pages quota (Cloudflare removed 2026-09-14). So:
#   - this runs on pull requests and on `main`, NEVER per publish
#   - everything runs in ONE job so the install happens once, not three times
#   - publish-triggered rebuilds are adaptively batched (separate deploy workflow)
#
# Package manager is pnpm (see pnpm-workspace.yaml for why).
# Node 24 per .sps/plan.md. Astro 7 / Vite 8 cannot run on DianaHost's Node
# 20.18.2, so this is the ONLY place the frontend is ever built.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # One Biome invocation over the whole repo — biome.json lives at the root
        # and resolves its include patterns relative to itself.
        run: pnpm run lint

      - name: Verify .astro frontmatter imports
        # ⚠️ `.astro` frontmatter is NOT typechecked in this project — `tsc` only
        # sees .ts/.tsx, and `@astrojs/check` (the tool that would cover .astro)
        # rejects TypeScript 7, which is why Biome was adopted instead.
        #
        # So an identifier used in a component's frontmatter without an import is
        # neither a type error nor a lint error: it is a ReferenceError at build
        # time, thrown only if that component actually renders. That is exactly
        # how the 2026-09-16 timezone fix shipped two broken imports — the thin
        # build passed because `CommentSection` self-hides without a CMS origin
        # and `DeadlineStrip` renders nothing without deadlines. A full build
        # against a live CMS is what finally surfaced it.
        #
        # Runs before the build: it needs no build, and failing here is faster
        # and clearer than failing inside the prerender.
        run: pnpm run verify:astro-imports

      - name: Verify the GPA calculation
        # The calculation is a pure module (`frontend/src/lib/gpa.ts`) with a
        # harness over it. It has to run on every push: three wrong answers shipped
        # while it was inline in a page `<script>`, because nothing could call it
        # and therefore nothing could check it.
        #
        # Needs no build. `--experimental-strip-types` is what lets the `.mjs`
        # harness import the real `.ts` module rather than a re-typed copy of the
        # rules — a copy would only prove two implementations agree.
        run: pnpm run verify:gpa

      - name: Verify the CGPA calculation
        # The university counterpart. It guards two mistakes that are easy to make
        # and both produce a confident wrong number: applying the *school* rule for
        # an F (which would report 0.00 for a student who failed one course but is
        # otherwise above 3.00), and assuming one grading scale when Bangladeshi
        # universities use several.
        run: pnpm run verify:cgpa

      - name: Verify the bookmark merge policy
        # Bookmark sync reconciles a list the reader owns on two devices, and every
        # wrong answer here is SILENT data loss — a save that disappears, or a
        # bookmark the reader deleted coming back. Neither throws and neither shows
        # up in a build, so the policy gets a harness of its own.
        #
        # This is the browser half (the pending-queue replay). The server's half —
        # "first sync merges, every sync after that takes the server's answer" — is
        # asserted over HTTP by `verify:endpoints` in the with-CMS step below.
        run: pnpm run verify:bookmarks

      - name: Verify the mid-article ad split
        # Splitting the article body to insert a mid-article ad is pure string
        # surgery, so it has a pure harness: it exercises the paragraph counting,
        # the split point, and — the one that actually matters — that no HTML tag
        # is ever sliced in half. A split that cuts through a tag produces broken
        # markup on the most-read page on the site.
        #
        # It matters specifically because the demo articles are all four
        # paragraphs, below the six-paragraph floor, so the split NEVER runs in a
        # normal build. Without this the logic would ship entirely unexercised.
        #
        # Imports `html-split.ts` rather than `richtext.ts`: the latter imports
        # extensionless (fine for Vite, unresolvable for Node's ESM loader).
        run: pnpm run verify:ad-split

      - name: Verify payload-types.ts is not stale
        # The one file in the CMS that can be wrong while the build stays green.
        # `payload-types.ts` is generated and committed; if a collection changes
        # and it is not regenerated, the file still typechecks — it is valid
        # TypeScript describing the OLD schema — so nothing fails here and the
        # error surfaces later as a missing property, far from the cause.
        #
        # Regenerates and compares against what is committed. Runs before the
        # with-CMS step because type generation reads the config, not the
        # database: no seed, no PAYLOAD_SECRET.
        run: pnpm run verify:payload-types

      - name: Verify the CMS migrations are not stale
        # The same drift bug one layer down from payload-types.ts, and the one
        # that reached production. `cms/src/migrations/` is generated, committed,
        # and applied by dev, CI and the host alike — so it can describe the OLD
        # schema while typecheck, lint and build all stay green.
        #
        # This is not hypothetical. On 2026-10-03 the production database was
        # 0 bytes and `payload migrate` was a no-op, because the repository had
        # no migrations at all; DianaHost reported `SQLITE_ERROR: no such table:
        # levels` and four separate workarounds were attempted before the cause
        # was found. See `.sps/handoff.md` → Current Phase.
        #
        # `migrate:create` writes a file only when the schema actually moved, so
        # the check is: generate, then see whether anything appeared. Counter-
        # proved in both directions — a drifted field fails and names the missing
        # migration; an unchanged schema passes and leaves the tree as it found it.
        #
        # Runs here, before the with-CMS step, because `migrate:create` sets
        # `disableDBConnect` and reads the config rather than the database.
        run: pnpm run verify:payload-migrations

      - name: Verify the client IP is not spoofable
        # clientIp() keys EVERY abuse control in the CMS: the rate limit on
        # comments, newsletter signup, poll votes, bookmark toggles and account
        # deletion, plus the poll voterHash and the reaction fingerprint — the
        # last two together being the duplicate-vote control.
        #
        # It reads that address from x-forwarded-for, which the client controls
        # and a proxy only appends to. Taking the wrong end of the header does
        # not weaken those controls, it removes them — silently, and only for an
        # attacker who bothers to rotate the header.
        #
        # The harness asserts a forged entry can never become the client IP, and
        # closes with a counter-proof that the previous implementation WAS fooled,
        # so the checks cannot all be trivially true.
        #
        # Pure: no CMS, no network, no database.
        run: pnpm run verify:client-ip

      - name: Verify SQLite WAL concurrency
        # 6 concurrent writer processes, 40 rows each, real lock contention —
        # because the CMS targets 5 editors publishing at once, and lock contention
        # would surface as silently failed publishes.
        #
        # This is a foundational database decision, not a late QA item:
        # `.sps/mistakes.md` M10 records the original plan gating it at S12, after
        # all twelve sections were built, and forbids repeating that.
        #
        # Each "editor" is a SEPARATE PROCESS with its own connection, because that
        # is what production actually does. The known finding is documented in the
        # harness: re-issuing `PRAGMA journal_mode = WAL` per connection is NOT
        # concurrency-safe, so it must be set once on the database, ever.
        #
        # Uses node:sqlite rather than libSQL. libSQL is a SQLite fork and WAL
        # contention is an engine-level property, so this faithfully answers the
        # question — but it is not the identical driver, which the harness states.
        run: pnpm run verify:sqlite-wal

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Astro sync (generate content + env types)
        # `astro sync` writes .astro/types.d.ts, which tsconfig.json includes.
        # Running it first stops the typecheck failing on missing generated types.
        run: pnpm --filter @shikkha24/frontend exec astro sync

      - name: Typecheck (frontend)
        # `tsc --noEmit`, not `astro check`: @astrojs/check rejects TypeScript 7
        # (peer range ^5 || ^6). Consequence: .astro templates are NOT
        # type-checked. See .sps/handoff.md item 41.
        run: pnpm run typecheck:frontend

      - name: Seed the CMS database
        # The frontend build fetches every article, category and setting over
        # HTTP, so CI needs a seeded CMS before it can produce a real build.
        #
        # Without this the build still **exits 0** but emits ~32 pages instead of
        # ~84 — the "thin build" false green (`sandbox-build-traps` Trap 2). The
        # harness steps below then fail on missing articles, which is how this
        # was caught: the gate was red, not the build.
        #
        # ⚠️ `mkdir -p cms/data` is required, and its absence is invisible
        # locally. The directory holds the SQLite archive and the media library,
        # so it is gitignored — meaning a fresh checkout does not have it, and
        # SQLite cannot create a file inside a directory that does not exist.
        # Locally the directory always exists, so the omission only ever shows up
        # on a runner: `ConnectionFailed("Unable to open connection to local
        # database ./data/ci.db: 14")`, where 14 is SQLITE_CANTOPEN.
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db
        run: |
          # `data/` holds the SQLite archive, `data/media/` the upload library.
          # Both are gitignored, so a fresh checkout has neither — and neither
          # SQLite nor the media harness creates its own directory.
          mkdir -p cms/data/media
          # Build the schema from the committed migrations BEFORE seeding. Since
          # `push: false`, `db:migrate` is the only thing that creates it here
          # — the same path production takes, so CI exercises the migrations the
          # host will actually run rather than a development-only auto-push.
          pnpm --filter @shikkha24/cms db:migrate
          pnpm --filter @shikkha24/cms seed
          pnpm --filter @shikkha24/cms seed:demo

      - name: CMS harnesses (local API)
        # These boot Payload directly rather than going over HTTP, so they need
        # the seeded database but not a running server. Each creates and cleans up
        # its own rows — none leaves state behind, and none touches the demo
        # content the frontend build depends on.
        #
        # 145 checks across the six. They ran only by hand until now; they were
        # the last harnesses outside CI.
        #
        # `verify:rebuild` asserts the trigger wiring structurally. Its behavioural
        # half needs a listener at DEPLOY_WEBHOOK_URL, so it is skipped rather than
        # failed when that is unset — correct here, where there is nothing to call.
        #
        # `verify:reporter` was written at S13 and ran only by hand until now —
        # the one harness that asserts a reporter cannot publish their own story
        # is exactly the one that must run on every push.
        #
        # `verify:id-card` (S14) asserts the generated cards are deterministic —
        # byte-identical across two runs — which is what the card's
        # `Cache-Control` + ETag contract depends on.
        #
        # ⚠️ `verify:access` runs FIRST and is the reason this list exists. A CMS
        # audit on 2026-09-30 found six authorisation holes — four critical, one of
        # them letting any account delete the whole media library — while every gate
        # here was green. `403`/`Forbidden` appeared zero times in `src/verify/`.
        # That harness now asserts, for every collection and every role, who may do
        # what; it is hermetic (it reads the config, writes nothing), so it costs
        # seconds and needs no fixtures.
        #
        # ⚠️ `endpoints` and `sync` are NOT in this loop: they make real HTTP
        # requests, so they need a live server, which this step does not have.
        # They run in "Verify CMS read and write paths" below, under `with-cms.sh`.
        # Adding `endpoints` here would fail the loop with ECONNREFUSED.
        #
        # ⚠️ `endpoints`, `social` and `rebuild-notice` were **missing from CI
        # entirely** until 2026-09-30 even though `docs/testing-and-qa.md` listed
        # them as "Every CI run" — the table was documenting a gate that did not
        # exist. `social` and `rebuild-notice` are hermetic, so they join this loop;
        # `endpoints` joins the with-CMS step. The table now matches both.
        #
        # The loop stops at the first failure (`bash -e`), and the echo names it.
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db
        run: |
          for h in access media newsletter engagement push oauth rebuild rebuild-notice reporter id-card reactions social; do
            echo "── verify:$h ──"
            pnpm --filter @shikkha24/cms verify:$h
          done

      - name: Build (frontend) against the seeded CMS
        # `CMS_URL` is the **build-time** content origin. `PUBLIC_CMS_ORIGIN` is a
        # different variable — the browser-facing origin for the interactive
        # islands — and is deliberately left unset here so those islands self-hide.
        #
        # `with-cms.sh` starts Payload, waits for it to answer, runs the build and
        # tears it down. A background process does not survive between steps, so
        # the CMS and the build must share one invocation.
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db
          CMS_URL: http://localhost:3000
          # Browser-facing media origin. `mediaUrl()` prefixes the CMS's relative
          # `/api/media/file/...` path with this; unset, it emits that path as-is,
          # and the static host has no `/api/` — so every article image 404s.
          # Deliberately the production value, so this build rehearses the deploy
          # build. `verify:links` is what caught this being missing.
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL || 'https://cms.shikkha24.com' }}
        run: scripts/with-cms.sh bash -c "pnpm run build:frontend"

      - name: Build output size ceiling
        # Regression guard on total dist size — NOT the per-page 1.2 MB payload
        # budget. This catches a catastrophic size regression across the whole
        # build (e.g. a source asset committed un-optimised, or a bundling config
        # change that bloats every page). At 84 pages the build output is ~8.8 MB;
        # 15 MB gives headroom for content growth.
        #
        # The per-page payload budget is enforced by the Lighthouse gate in the
        # next step (`total-byte-weight` ≤ 1.2 MB, measured per page). These two
        # are complementary: this one bounds the whole site cheaply, that one
        # bounds a single page load.
        # Adjust if page count or asset strategy changes materially.
        run: |
          set -euo pipefail
          kb=$(du -sk frontend/dist | cut -f1)
          echo "frontend/dist = ${kb} KB"
          if [ "$kb" -gt 15360 ]; then
            echo "::error::frontend/dist exceeds the 15 MB build-output ceiling (regression guard; per-page payload budget is enforced by Lighthouse CI)"
            exit 1
          fi

      - name: Lighthouse gate (performance, accessibility, payload)
        # F-16. `.sps/plan.md` states page-level budgets (perf ≥95, a11y ≥90,
        # initial payload <1.2 MB, CLS <0.02); this is where they are enforced.
        #
        # Runs HERE, after the build, because LHCI measures a served `dist/` —
        # which is exactly what the build two steps above produced. It cannot run
        # any earlier, and it needs no CMS (the output is static).
        #
        # Thresholds live in `lighthouserc.json` and are derived from a measured
        # baseline, not from the aspirational plan targets — see the script header
        # and `docs/performance-budget.md` §8. Two gaps are recorded rather than
        # hidden: perf holds ≥90 against a plan target of ≥95, and LCP is NOT
        # asserted because it measures ~2.7-2.9s against a plan target of <1.5s.
        # A gate set at the plan target would be permanently red and would get
        # switched off, which is worse than an honest ceiling.
        #
        # ⚠️ The script self-tests that its own assertions can still fail.
        # `lhci` exits 0 when an assertion key matches nothing, so a typo would
        # make this step permanently green. The self-test is what stops that.
        #
        # Chrome comes from the runner image (no ~300 MB download). CI-minutes:
        # this runs on pushes and PRs, never per publish, per the budget header.
        run: pnpm run verify:lighthouse

      - name: Verify .htaccess against a real Apache
        # Serves the built dist/ through the real .htaccess on a real Apache and
        # asserts the status code, the header count and the profile of every page.
        #
        # This replaced a harness that parsed the rules and reimplemented Apache's
        # regex matching in JavaScript. That one passed while the file was
        # **unrunnable**: `<LocationMatch>` is not permitted in .htaccess context,
        # so Apache answered HTTP 500 to every request. Only running the server
        # can catch a context error, so this step does.
        #
        # apache2 is preinstalled on ubuntu-latest; the install is a fallback so a
        # runner image change cannot silently turn this gate into a no-op. The
        # harness itself exits 1 when no Apache binary is present — it never skips.
        run: |
          set -euo pipefail
          if ! command -v apache2 >/dev/null && [ ! -x /usr/sbin/apache2 ]; then
            echo "apache2 not found — installing it so the .htaccess gate can run"
            sudo apt-get update -qq
            sudo apt-get install -y -qq apache2
          fi
          pnpm run verify:apache

      - name: Verify build output
        # Asserts the dist directory is well-formed: sitemaps present and populated,
        # no inline scripts, no stale URL prefixes, and — since 2026-10-02 — that
        # the build is not THIN. No CMS_URL here, so it applies the absolute floor
        # rather than comparing against a live CMS count.
        run: pnpm run verify:build-output

      - name: Verify internal links
        # Every `href`/`src` in the built output must resolve to a built file.
        # Astro does not resolve `href` strings, and a link to a route that was
        # never generated is still valid HTML — so the build stays green and the
        # reader gets a 404. That is how `/latest` shipped a "পরের →" link
        # pointing at `/latest/page/2` with no route behind it.
        run: pnpm run verify:links

      - name: Verify the search-page bootstrap
        # Runs `public/search-init.js` against a DOM: the date filter's values are
        # reordered there because Pagefind renders them in index order, and a
        # wrong comparison or a lost idempotence guard fails silently.
        #
        # ⚠️ **This step prints SKIP here.** The harness needs `linkedom`, which is
        # deliberately not a project dependency — it is not worth one for a single
        # check. The skip is explicit and names the fix, so it discloses that the
        # check did not run rather than implying it passed. Add `linkedom` as a
        # devDependency to make it real in CI; until then it is a local harness.
        #
        # The failure mode it guards against — Pagefind renaming its internal
        # filter markup — IS covered in CI, by the hook check in verify:build-output.
        run: pnpm run verify:search-init

      - name: Verify CMS read and write paths
        # The two harnesses that need a LIVE CMS, so they share one `with-cms.sh`
        # invocation (a background process does not survive between steps).
        #
        #   verify:sync      — the READ path: every CMS record appears on the page
        #                      it is rendered by. Needs the CMS *and* the build, so
        #                      it must run after the build step above.
        #   verify:endpoints — the WRITE path: reader submissions over real HTTP,
        #                      written then read back then cleaned up.
        #
        # Both are the kind of check that fails silently in production: a broken
        # read path yields a green build missing rows, and a broken write path
        # yields a 404 the reader hits. Neither is visible to an exit code.
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db
          CMS_URL: http://localhost:3000
        run: scripts/with-cms.sh bash -c "pnpm run verify:sync && pnpm run verify:endpoints"

      - name: Upload frontend build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      # ── CMS ─────────────────────────────────────────────────────────────────
      - name: Build (CMS, standalone)
        # `next build` performs its own type checking, so a type error fails here.
        run: pnpm run build:cms
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db

      - name: Typecheck (CMS)
        # Runs AFTER the build on purpose: `next build` writes .next/types, which
        # tsconfig.json includes. Running this first would fail on missing files.
        run: pnpm run typecheck:cms

      - name: Assemble and measure the standalone deploy bundle
        # Two things this asserts, both learned the hard way at S0:
        #   1. In a pnpm monorepo the entry point is .next/standalone/cms/server.js,
        #      NOT .next/standalone/server.js.
        #   2. Next does NOT copy .next/static into the bundle — the deploy must.
        #      Without it the admin loads but every asset 404s.
        #   3. The Bengali card font (S14) is not traced by Next either. The card
        #      endpoints read it relative to the bundle root at runtime, so it is
        #      copied beside the app exactly like .next/static above. Without it
        #      /api/idcard/:id.png answers 503 rather than rendering tofu.
        run: |
          set -euo pipefail
          ROOT=cms/.next/standalone
          if [ ! -f "$ROOT/cms/server.js" ]; then
            echo "::error::standalone entry point missing at $ROOT/cms/server.js"
            exit 1
          fi
          mkdir -p "$ROOT/cms/.next/static"
          cp -R cms/.next/static/. "$ROOT/cms/.next/static/"
          mkdir -p "$ROOT/cms/fonts"
          cp assets/fonts/vendor/solaimanlipi-400.woff2 assets/fonts/vendor/solaimanlipi-700.woff2 "$ROOT/cms/fonts/"
          # 4. The CMS migrations are the same case, and the one that reached
          #    production. `payload migrate` locates them at `src/migrations`,
          #    `dist/migrations` or `migrations` relative to the working
          #    directory (payload `dist/database/migrations/findMigrationDir.js`).
          #    The whole `src/` tree does happen to be traced into the bundle
          #    today - but nothing in next.config.ts asks for it (there is no
          #    outputFileTracingIncludes), so relying on it would mean betting
          #    production on undocumented tracing behaviour. Without them the
          #    host cannot build its schema at all: that was the 2026-10-03
          #    outage, where `payload migrate` was a no-op and the database
          #    stayed 0 bytes.
          mkdir -p "$ROOT/cms/src/migrations"
          cp -R cms/src/migrations/. "$ROOT/cms/src/migrations/"
          # Assert the copy actually landed rather than trusting `cp`. A silent
          # miss here is a dead production deploy, not a visible build failure.
          if [ ! -f "$ROOT/cms/src/migrations/index.ts" ]; then
            echo "::error::migrations missing from the deploy bundle - the host could not build its schema"
            exit 1
          fi
          mb=$(du -sm "$ROOT" | cut -f1)
          echo "standalone bundle = ${mb} MB (target 300-600 MB)"
          echo "Measured at S0 on this exact stack: 114 MB."
          if [ "$mb" -gt 700 ]; then
            echo "::error::standalone bundle exceeds 700 MB and will not fit the 2 GB host"
            exit 1
          fi

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v7
        with:
          name: cms-standalone
          path: cms/.next/standalone
          # Next's deploy bundle contains hidden `.next` directories. GitHub
          # excludes hidden files from artifacts by default, which produces a
          # successful-looking but unusable download without this flag: the
          # admin HTML loads and every asset 404s. Recovered from the deploy
          # branch (0ecbeda) during the 2026-10-03 reconciliation — it was
          # never on main, so every main-built artifact was affected.
          include-hidden-files: true
          retention-days: 7

      # ── Supply chain ────────────────────────────────────────────────────────
      - name: Dependency audit
        # Policy: docs/security.md §9 — high and critical block the build.
        run: pnpm audit --audit-level=high

      # ── Not yet wired ─────────────────────────────────────────────────────
      # What remains needs infrastructure CI does not have:
      #
      # Broken-link checking over the live network and JSON-LD validation
      # against the served templates. (Lighthouse CI is NO LONGER in this list —
      # it is wired above, serving the built `dist/`.)
      #
      # ⚠️ The page-level budgets are **partly** enforced now, and the gap is
      # deliberate rather than forgotten. Enforced in CI: perf ≥90, a11y ≥90,
      # SEO ≥90, CLS ≤0.03, payload ≤1.2 MB. Still production-only:
      #
      #   - **LCP <1.5s** — measures 2.7-2.9s in the lab today. Asserting the plan
      #     target would be permanently red. See docs/performance-budget.md §8.
      #   - **Perf ≥95** — the plan target; the gate holds ≥90 against a measured
      #     93-98. Closing the gap is optimisation work, not a threshold change.
      #   - **TTFB <200ms** — a hosting property, measured once at S12 on
      #     DianaHost with no CDN. See .sps/plan.md.
      #   - **Data-saver <30 KB** — not implemented; recorded as a known gap.
      #   - **INP <100ms** — a field metric; lab Lighthouse cannot measure it
      #     (TBT is the documented lab proxy).
      #
      # All lab numbers are simulated-4G, not field data. See .sps/plan.md.
