# Shikkha24 — continuous integration
#
# Why CI exists at all: editors only ever use the Payload admin panel; they never
# touch GitHub. Publishing fires a webhook and CI turns a publish into static
# HTML. Full explanation: docs/hosting-and-deployment.md §1.
#
# CI-MINUTES BUDGET (agent rule 7 + docs/hosting-and-deployment.md §2):
# the repository is private, so GitHub Actions is capped at 2,000 minutes/month.
# Cloudflare Pages is capped at 500 builds/month — the tighter of the two. So:
#   - this runs on pull requests and on `main`, NEVER per publish
#   - everything runs in ONE job so the install happens once, not three times
#   - publish-triggered rebuilds are adaptively batched (separate deploy workflow)
#
# Package manager is pnpm (see pnpm-workspace.yaml for why).
# Node 24 per .sps/plan.md. Astro 7 / Vite 8 cannot run on DianaHost's Node
# 20.18.2, so this is the ONLY place the frontend is ever built.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # One Biome invocation over the whole repo — biome.json lives at the root
        # and resolves its include patterns relative to itself.
        run: pnpm run lint

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Astro sync (generate content + env types)
        # `astro sync` writes .astro/types.d.ts, which tsconfig.json includes.
        # Running it first stops the typecheck failing on missing generated types.
        run: pnpm --filter @shikkha24/frontend exec astro sync

      - name: Typecheck (frontend)
        # `tsc --noEmit`, not `astro check`: @astrojs/check rejects TypeScript 7
        # (peer range ^5 || ^6). Consequence: .astro templates are NOT
        # type-checked. See .sps/handoff.md item 41.
        run: pnpm run typecheck:frontend

      - name: Build (frontend)
        run: pnpm run build:frontend

      - name: Byte budget — build output
        # Coarse guard for docs/performance-budget.md §3. The real 1.2 MB target is
        # a per-page measurement and belongs to Lighthouse CI (wired at S3+, when
        # real page templates exist — asserting it against the S0 placeholder
        # would prove nothing).
        run: |
          set -euo pipefail
          kb=$(du -sk frontend/dist | cut -f1)
          echo "frontend/dist = ${kb} KB"
          if [ "$kb" -gt 12288 ]; then
            echo "::error::frontend/dist exceeds the 1.2 MB budget"
            exit 1
          fi

      - name: Upload frontend build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      # ── CMS ─────────────────────────────────────────────────────────────────
      - name: Build (CMS, standalone)
        # `next build` performs its own type checking, so a type error fails here.
        run: pnpm run build:cms
        env:
          PAYLOAD_SECRET: ci-placeholder-not-a-real-secret
          DATABASE_URI: file:./data/ci.db

      - name: Typecheck (CMS)
        # Runs AFTER the build on purpose: `next build` writes .next/types, which
        # tsconfig.json includes. Running this first would fail on missing files.
        run: pnpm run typecheck:cms

      - name: Assemble and measure the standalone deploy bundle
        # Two things this asserts, both learned the hard way at S0:
        #   1. In a pnpm monorepo the entry point is .next/standalone/cms/server.js,
        #      NOT .next/standalone/server.js.
        #   2. Next does NOT copy .next/static into the bundle — the deploy must.
        #      Without it the admin loads but every asset 404s.
        run: |
          set -euo pipefail
          ROOT=cms/.next/standalone
          if [ ! -f "$ROOT/cms/server.js" ]; then
            echo "::error::standalone entry point missing at $ROOT/cms/server.js"
            exit 1
          fi
          mkdir -p "$ROOT/cms/.next/static"
          cp -R cms/.next/static/. "$ROOT/cms/.next/static/"
          mb=$(du -sm "$ROOT" | cut -f1)
          echo "standalone bundle = ${mb} MB (target 300-600 MB)"
          echo "Measured at S0 on this exact stack: 114 MB."
          if [ "$mb" -gt 700 ]; then
            echo "::error::standalone bundle exceeds 700 MB and will not fit the 2 GB host"
            exit 1
          fi

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: cms-standalone
          path: cms/.next/standalone
          retention-days: 7

      # ── Supply chain ────────────────────────────────────────────────────────
      - name: Dependency audit
        # Policy: docs/security.md §9 — high and critical block the build.
        run: pnpm audit --audit-level=high

      # ── Deliberately not yet wired ──────────────────────────────────────────
      # Lighthouse CI, broken-link check and JSON-LD validation need real page
      # templates. They are wired at S3+ per docs/testing-and-qa.md §1. Running
      # them against the S0 placeholder would assert nothing.
