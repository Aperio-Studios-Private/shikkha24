name: probe-extract

# ⚠️ TEMPORARY diagnostic — deleted after it has answered its question.
#
# `Fileman::fileop op=extract` returns success and writes nothing on this host,
# and `Fileman::extract_files` (UAPI) does not exist. So the frontend deploy can
# only be completed by a human in File Manager, which is unacceptable for a
# deploy. This probes for a mechanism that actually works, so the question is
# answered by measurement rather than by another round of guessing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Probe every extraction mechanism this host might offer
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: node scripts/probe-extract.mjs