# pnpm workspace — Shikkha24
#
# Why pnpm and not npm: Payload's own template targets pnpm (`workspace:*`
# internal refs plus a `pnpm.onlyBuiltDependencies` block), Astro 7's engines
# explicitly accept `pnpm >=7.1.0`, and pnpm is also the only installer that
# works in the sandboxed build environment used for S0 verification. See
# `.sps/handoff.md` → "Package manager".
#
# `package.json` still carries a `workspaces` field for npm compatibility, but
# pnpm reads THIS file — keep the two lists in sync if a workspace is added.

packages:
  - frontend
  - cms

# Native toolchains that MUST run post-install scripts to fetch their binaries.
# Without these the builds fail: esbuild (Vite/Astro), sharp (Payload image
# resizing), workerd (wrangler's local dev runtime — required by `wrangler dev`
# only, not by `wrangler deploy`). Each is a pinned, license-reviewed
# dependency (agent rule 8).
allowBuilds:
  esbuild: true
  sharp: true
  # Added 2026-10-15 with wrangler 4.151.0 (T-18 P1). Apache-2.0.
  workerd: true

# ── Security overrides (pnpm 10+ reads these from THIS file, not package.json) ─
#
# Transitive dependencies pinned forward past a published advisory **because
# upstream has not moved yet**. Both entries were added on 2026-09-30 after
# `pnpm audit --audit-level=high` began failing on a lockfile that had passed two
# days earlier — the advisories are new, the dependency graph is not.
#
# ⚠️ **Scoped to the exact vulnerable version, deliberately.**
# `undici` exists twice in this tree: 7.29.0 via Payload (vulnerable) and 8.10.2
# via Astro's `unifont` (not vulnerable). A bare `undici: 7.29.1` would drag
# Astro's copy **backwards a major version**. The `@version` key targets only the
# instance that needs it, and stops applying by itself once upstream ships a
# fixed release — which is the behaviour we want.
#
# ⚠️ **Both entries are temporary.** Delete them when Payload moves on. Verified
# 2026-09-30: the latest `payload@3.90.2` still pins `undici: 7.29.0` and the
# latest `@payloadcms/email-nodemailer@3.90.2` still declares `nodemailer: ^9.1.1`,
# so no released version of either fixes these.
#
# Review notes (agent rule 8 — licence confirmed for each):
#   undici 7.29.1   — MIT.  Patch within 7.x. Clears GHSA-w293-vg96-wgc3 (TLS
#                     certificate validation bypass in BalancedPool) and the
#                     WebSocket-subprotocol DoS advisory.
#   nodemailer 10.0.6 — MIT-0. A MAJOR bump against the adapter's `^9.1.1`, so it
#                     was checked rather than assumed: v10.0.0's only documented
#                     breaking change is "Node.js 20 or newer is required" — it is
#                     a TypeScript/ESM rewrite, and the release notes explicitly
#                     keep the CommonJS entry point and the transporter types
#                     compatible. This project requires Node >=20.9 (CMS) and
#                     >=22.12 (frontend). Clears GHSA-v53p-9fqp-m79j (addressparser
#                     ReDoS). The SMTP path is inactive until SMTP is configured,
#                     so the runtime exposure was nil either way.
#   devalue 5.9.4 — MIT. Astro pulls devalue transitively via unifont, and
#                     5.9.2 carries three advisories: GHSA-j22f-vq7h-c4qm
#                     (stringify/uneval serialise shared memory),
#                     GHSA-mcm9-63f2-9j32 (repeated primitive strings cause
#                     quadratic behaviour) and GHSA-x5rw-q4pp-hg5g
#                     (stringifyAsync can throw unhandled). Scoped to the
#                     exact vulnerable version so it stops applying by itself
#                     once upstream moves on.
overrides:
  # 2026-10-27: bumped 7.29.1 → 7.30.1 for GHSA-xjj6-f33q-929c — see the
  # annotated entry at the bottom of this block.
  'undici@7.29.0': 7.30.1
  'nodemailer@9.1.1': 10.0.16
  'devalue@5.9.2': 5.9.4
  # Added 2026-10-15 (T-10, Payload 3.90.2 migration) — three dev-tooling
  # transitives of @lhci/cli (Lighthouse CI) whose advisories have fixes
  # published upstream. All three sit on paths CI never exercises: basic-ftp
  # only speaks ftp:// (get-uri, unused — CI fetches http://localhost),
  # tmp only backs interactive editor prompts (external-editor, unused
  # headless). Review notes (agent rule 8 — licence confirmed for each):
  #   basic-ftp 6.2.3  — MIT. Major bump against get-uri's ^5.0.2; the FTP
  #                      list() code path is not reachable in CI, and the
  #                      advisory (quadratic CPU in Client.list()) dies with it.
  #   tmp 0.2.7        — MIT. Major bump against external-editor's ^0.0.29;
  #                      fileSync survives (the advisory is IN fileSync's
  #                      prefix/postfix handling — GHSA-ph9p-34f9-6g65).
  #   tmp 0.2.7        — MIT. Major bump against the consumers' ^0.0.29/^0.1.0
  #                      ranges (@lhci/cli → inquirer → external-editor);
  #                      fileSync survives (the advisory is IN fileSync's
  #                      prefix/postfix handling — GHSA-ph9p-34f9-6g65).
  #                      @lhci/cli declares tmp twice (0.0.33 via external-editor
  #                      and 0.1.0 directly) — both instances are scoped.
  'source-map-js@1.2.1': 1.2.2
  'tmp@0.0.33': 0.2.7
  'tmp@0.1.0': 0.2.7
  'basic-ftp@5.3.1': 6.2.3
  # Added 2026-10-16 (T-20 security pass). `dompurify@3.4.8` is exactly the version
  # `monaco-editor@0.56.0` pins — a hard pin, not a range — so a normal update can
  # never reach the fix and the advisory would sit there indefinitely. An override is
  # the only route, which is the same situation as the entries above.
  #   Advisory: GHSA-6688-9rhm-gjv2 (and GHSA-c2j3-45gr-mqc4), both low severity,
  #             "pure HTML reparse executes attacker markup". Patched in >=3.4.16.
  #   Licence:  MPL-2.0 OR Apache-2.0 (unchanged by the bump).
  #   Path:     cms -> @payloadcms/ui -> @monaco-editor/react -> monaco-editor ->
  #             dompurify. Monaco is the CMS's code editor — admin-only, and it
  #             sanitises text an editor pastes into their own session. It is not on
  #             any reader-facing path and the storefront never loads it.
  #   Scoped to the exact vulnerable version so it stops applying by itself when
  #   monaco-editor moves on.
  'dompurify@3.4.8': 3.4.17
  # Added 2026-10-27 (T-18 P4 Option A, audit gate). Four fixes with published
  # patched releases — the overrides mechanism applies. Review notes (agent
  # rule 8 — licence confirmed for each):
  #
  #   body-parser 1.20.9 — MIT. Patch release within express's ^1.20.x range
  #     (via @lhci/cli → express). Clears GHSA-27r3-jxmh-p828 (DoS via trailing
  #     bytes after a compressed body). Reachable only inside the LHCI CI
  #     server process, never in production.
  #
  #   undici 7.30.1 — MIT. Patch within 7.x; the 2026-09-30 override
  #     'undici@7.29.0' → 7.29.1 (kept at the TOP of this block) is bumped to
  #     7.30.1. Clears GHSA-xjj6-f33q-929c (DoS via unhandled rejection) for
  #     the cms>…>payload>undici instance. That instance IS in the CMS runtime
  #     (Payload uses undici for fetch internals), which is why this one is an
  #     override and not an ignore.
  #
  #   undici 8.12.2 — MIT. Patch within 8.x for Astro's copy (unifont), same
  #     advisory. Build-time only: the frontend build runs in CI, the built
  #     site is static files.
  #
  #   zod 3.25.76 → 4.6.7? NO — chromium-bidi@14 (via LHCI → puppeteer-core)
  #     declares zod ^3.24.1, so 4.x would violate its range; see the
  #     GHSA-mrhx-c7xc-m3w5 ignore entry below for why that is tolerated.
  #
  #   happy-dom 20.14.3 → 21.0.4? NO — @lexical/headless declares ^20.9.0 and
  #     the patched release is a major bump; see GHSA-834v-8h66-3h79 below.
  'body-parser@1.20.8': 1.20.9
  'undici@8.10.2': 8.12.2
  # miniflare (via frontend>wrangler) pins undici at EXACTLY 7.29.1 — a hard
  # pin, not a range — so the same GHSA-xjj6-f33q-929c fix needs its own key.
  # wrangler/miniflare is local-dev tooling (wrangler dev / deploys), never
  # part of the deployed site; 7.30.1 is a patch within the same major.
  'undici@7.29.1': 7.30.1
  # Added 2026-10-29 (SEO-task session, CI gate went red between runs — the
  # advisory is new, the dependency graph is not). Review notes (agent rule 8):
  #
  #   graphql-scalars 2.0.1 — MIT, patch release clearing GHSA-x8rm-f576-gq67
  #     (PhoneNumber scalar ReDoS). @payloadcms/graphql pins EXACTLY 1.22.2
  #     (not a range), so the scoped key is required to move it. Reachability:
  #     was treated as reachable (phone fields flow through scalars) — and on
  #     2026-10-29 the GraphQL mount was disabled outright
  #     (payload.config.ts `graphQL: { disable: true }`, pentest H3), which
  #     removes the runtime path entirely. The override STAYS: the audit gate
  #     still counts the advisory, and defense-in-depth if GraphQL is ever
  #     re-enabled (its own comment requires rate-limiting the route first).
  #     Scoped to `<=2.0.0`: once Payload's range includes a fixed version the
  #     key stops matching by itself.
  'graphql-scalars@1.22.2': 2.0.1
# ── pnpm audit ────────────────────────────────────────────────────────────────
# ⚠️ pnpm 11.22 deprecates `auditConfig` in favour of THIS `audit` block; when
# both are present the old one is ignored with a warning (T-10, 2026-10-15).

# pnpm 11 enforces a minimum package age as supply-chain protection: a freshly
# published version cannot be installed until it has been public for N minutes,
# which starves typosquat/hijack attacks of their window. Pentest 2026-10-29
# (L8): the exclude list below existed WITHOUT the base setting, so the gate was
# inert — and the list had drifted (next@16.3.5 vs the installed 16.4.3). Both
# fixed: the gate is now ON (24 h), and every exclude names the installed
# version. Excludes exist because the stack pins exact versions verified against
# the live registry (agent rule 8); a pin older than 24 h would otherwise be
# uninstallable.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next@16.4.3
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  # Payload's i18n package — pinned to the exact Payload version so the Bengali
  # admin locale bundle is built against the matching translation schema.
  - '@payloadcms/translations@3.90.2'

# ── Audit policy ─────────────────────────────────────────────────────────────
# `level: high` is the gate CI enforces: docs/security.md §9. Two advisories are
# tolerated below, and **both say "Patched versions: None"** — upstream has not
# shipped a fix, so there is no version to move to. Overrides cannot help either;
# that mechanism needs a patched release to point at. These are therefore
# documented, scoped, and re-checked by hand rather than silently waved through.
#
# Neither ships to production, which is the reason for tolerating them at all:
#
#   • **Astro is not in the CMS at all** — verified, `astro in cms deps: NO`.
#     Astro builds the static frontend, and that build runs in CI on GitHub's
#     runner, never on DianaHost. The CMS is a Next standalone bundle whose
#     runtime trace contains neither package.
#
#   • **Both are BUILD-TIME ONLY transitives.** `http-cache-semantics` comes via
#     astro's toolchain; `braces` via micromatch -> fill-range. Neither is a
#     direct dependency of `cms` or `frontend`.
#
#   • **`braces` (GHSA-vfj7-8cjw-p6xm, CVE-2026-93687)** — uncontrolled
#     recursion in the AST walkers; a deeply nested pattern exhausts the stack.
#     The input is a build-time glob pattern, never reader-supplied data.
#
#   • **`http-cache-semantics` (GHSA-ch52-4w7c-c8xp, CVE-2026-93748)** —
#     max-stale can expose cross-user cache entries. It only matters to a program
#     running a **shared HTTP cache**, and no reader-facing component here does:
#     the storefront is static files behind Apache, and the CMS serves its own
#     API without an intermediary cache.
#
# pnpm 12.4.0+ excludes ignored advisories from the totals and reports them
# separately, so the gate cannot pass by hiding a *new* finding: a third
# un-ignored high or critical still fails the build.
#
# ⚠️ **Re-check these two on every dependency bump** and delete each entry as
# soon as upstream publishes a fix. They are a holding position, not a permanent
# exemption.
audit:
  level: high
  ignore:
    # No patched release exists upstream. MIT-licensed. Build-time only.
    - GHSA-vfj7-8cjw-p6xm
    # No patched release exists upstream. MIT-licensed. Build-time only.
    - GHSA-ch52-4w7c-c8xp
    # extract-zip (transitive of @lhci/cli, build-time only): two symlink
    # advisories whose fix (>=2.0.2) has NO published release yet — an override
    # cannot reach it. Delete when extract-zip ships 2.0.2. (T-10, 2026-10-15.)
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # Added 2026-10-27 (T-18 P4). Both have patched releases upstream, but the
    # fix is a MAJOR version that violates the direct consumer's declared range
    # — an override would be a forced major downgrade/bump against the consumer
    # (the failure mode the scoped-override note above warns about). Both are
    # proven unreachable in our production runtime:
    #
    #   • `zod@3.25.76` (GHSA-mrhx-c7xc-m3w5, memory exhaustion validating
    #     oversized collections) — path: @lhci/cli → lighthouse → puppeteer-core
    #     → chromium-bidi@14 (declares zod ^3.24.1; patched zod is >=4.6.6).
    #     chromium-bidi validates Chrome DevTools-protocol messages from the
    #     LOCAL Chrome that LHCI itself launches inside the CI runner. Not
    #     reader-facing; not shipped; LHCI is a CI-only tool.
    #
    #   • `happy-dom@20.14.3` (GHSA-834v-8h66-3h79, unsanitized import alias →
    #     host code execution; patched >=21.0.4, a major bump against
    #     @lexical/headless's ^20.9.0) — path: cms → @payloadcms/
    #     richtext-lexical → @lexical/headless → happy-dom. happy-dom sits ONLY
    #     behind the `@lexical/headless/dom` subpath export; grep of the built
    #     standalone CMS bundle (server chunks + traced node_modules) found
    #     ZERO references — the production CMS never loads it. The vulnerable
    #     code path is lexical's headless HTML import of untrusted HTML, which
    #     this app does not use (no HeadlessHtmlImportFeature configured).
    #     Delete both entries when the consumers move within range.
    #
    #   • 2026-10-29: `happy-dom@20.14.3` ALSO matches GHSA-c8p4-j97h-3vg8
    #     (SSRF via iframe/link-stylesheet when parsing untrusted HTML;
    #     patched >=20.14.7, which was never published — the 20.x line ends at
    #     20.14.6, so the fix is the same unreachable 21.x major). Same
    #     package, same zero-reference proof, same non-configured code path:
    #     this app never asks happy-dom to parse untrusted HTML.
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-834v-8h66-3h79
    - GHSA-c8p4-j97h-3vg8
