#:schema node_modules/../../frontend/node_modules/wrangler/config-schema.json
# Publish watcher (T-19) — Shikkha24 CMS → site rebuild trigger.
#
# A standalone Worker, separate from the storefront (shikkha24-frontend):
# every 5 minutes it polls the CMS's public REST API, hashes the state, and
# fires the same `repository_dispatch` the webhook used to send. It exists
# because the CMS's own webhook can never be configured on DianaHost (cagefs
# fork failure, ticket #0590191). Design: docs/hosting-and-deployment.md §10.6.
#
# GITHUB_TOKEN is deliberately NOT here — it is a Worker secret added by the
# owner after deploy (`wrangler secret put GITHUB_TOKEN` or the dashboard).

name = "shikkha24-publish-watcher"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = true
# CLI deploys drop dashboard-added secrets unless this is set — the owner's
# GITHUB_TOKEN is added in the dashboard, so it must survive every redeploy.
keep_vars = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
# T-18 P4 Option A (owner-approved 2026-10-27): the CMS moved to Render
# (shikkha24-cms-9vai.onrender.com, Neon Postgres). The watcher now polls the
# Render CMS; DianaHost's cms.shikkha24.com is rollback-only. The 5-minute
# cadence absorbs Render free-tier cold starts (~50 s first probe).
CMS_ORIGIN = "https://shikkha24-cms-osmg.onrender.com"
# Repo moved to the org (owner shared it with the client's GitHub account).
GITHUB_REPO = "Aperio-Studios-Private/shikkha24"

[[kv_namespaces]]
binding = "PUBLISH_WATCHER"
id = "9f6c947cf63b4028856079a312bbcd4f"
