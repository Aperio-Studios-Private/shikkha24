<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OG image for social media share previews.
       Design: brand-red field, the real logo mark centred, domain in Latin.
       No Bengali text — social scrapers (Facebook/X/WhatsApp/LinkedIn) don't
       support SVG and can't render Bengali without a font. Latin-only keeps it
       universally renderable. The wordmark "শিক্ষা২৪" lives on the site itself;
       the social card just needs to be recognizable and on-brand. -->
  <rect width="1200" height="630" fill="#da1c25"/>

  <!-- Logo mark: the Illustrator-exported brand logo (docs/assets/logo.svg)
       scaled to 200×200, centred horizontally, positioned at y=140.
       The mark is a 48×48 viewBox; scale = 200/48 ≈ 4.167.
       Translate: x = (1200-200)/2 = 500, y = 140 -->
  <g transform="translate(500, 140) scale(4.167)">
    <rect width="48" height="48" rx="10" ry="10" fill="#da1c25" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
    <path d="M7.8,28.48c6.07-3.51,10.8-3.51,16.2,0,5.4-3.51,10.12-3.51,16.2,0"
      fill="none" stroke="#fff" stroke-linecap="round" stroke-width="4.05"/>
    <path d="M7.8,16.33c6.07-3.51,10.8-3.51,16.2,0,5.4-3.51,10.12-3.51,16.2,0"
      fill="none" stroke="#fff" stroke-linecap="round" stroke-width="4.05" opacity="0.6"/>
    <rect x="19.95" y="35.9" width="8.1" height="8.1" rx="2.02" ry="2.02"
      fill="#fff" opacity="0.85"/>
  </g>

  <!-- Domain name: Latin only, universally renderable -->
  <text x="600" y="430" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="2">shikkha24.com</text>

  <!-- Tagline in English (Latin) for international recognition -->
  <text x="600" y="490" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#fff" text-anchor="middle" opacity="0.7">Bangladesh Education News &amp; Opportunities</text>
</svg>
