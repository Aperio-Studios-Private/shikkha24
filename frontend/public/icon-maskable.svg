<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: full-bleed brand background with safe-zone logo mark.
       Maskable icons must fill the entire 512x512 canvas (no transparency)
       because the platform clips to a circle/squircle. The logo mark sits
       inside the 80% safe zone (409.6x409.6 centred). -->
  <rect width="512" height="512" fill="#da1c25"/>
  <g transform="translate(128, 128) scale(5.333)">
    <path d="M7.8,28.48c6.07-3.51,10.8-3.51,16.2,0,5.4-3.51,10.12-3.51,16.2,0"
      fill="none" stroke="#fff" stroke-linecap="round" stroke-width="4.05"/>
    <path d="M7.8,16.33c6.07-3.51,10.8-3.51,16.2,0,5.4-3.51,10.12-3.51,16.2,0"
      fill="none" stroke="#fff" stroke-linecap="round" stroke-width="4.05" opacity="0.6"/>
    <rect x="19.95" y="35.9" width="8.1" height="8.1" rx="2.02" ry="2.02"
      fill="#fff" opacity="0.85"/>
  </g>
</svg>
