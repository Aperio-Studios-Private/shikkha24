# Cloudflare Workers configuration — Shikkha24 static frontend (T-18 P1)
#
# Deploys the Astro build in `./dist` as Workers static assets. Deploys are
# atomic version uploads; rollback is instant in the dashboard, and the cPanel
# path (`deploy.yml`, mode=live target=static) remains while DNS still points
# at DianaHost. Mechanism + research: docs/hosting-and-deployment.md section 10.
#
# ⚠️ This deliberately does NOT use the retired Workers Sites pattern
# (`[site]` + `entry-point = "workers-site"`); earlier drafts used it and that
# config could never have deployed (see .sps/handoff.md, M35).
#
# ⚠️ Routes/custom domain: added 2026-10-15 once the shikkha24.com zone went
# active in this Cloudflare account (owner moved nameservers from
# ns1–3.dianadns.com to Cloudflare the same day — P6). `custom_domain = true`
# makes Cloudflare create the DNS records + edge certificates itself. Apex and
# www are both attached.

#:schema node_modules/wrangler/config-schema.json
name = "shikkha24-frontend"
main = "./worker/index.ts"
compatibility_date = "2026-10-15"
# The preview URL (`https://shikkha24-frontend.<account>.workers.dev`) stays
# reachable alongside the production domain (the deploy's live probe uses it),
# and carries `X-Robots-Tag: noindex` (via worker/headers.ts) so it cannot
# cannibalise search presence.
workers_dev = true
routes = [
  { pattern = "shikkha24.com", custom_domain = true },
  { pattern = "www.shikkha24.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# Astro emits dist/404.html (S0); serve it (status 404) for unknown paths.
not_found_handling = "404-page"
# The site's URL mode is `trailingSlash: 'never'` (astro.config.mjs) — the
# Apache rollback path served `/latest` with 200, no redirect. The platform
# default ("auto-trailing-slash") 307-redirects every directory URL to a
# trailing slash, which made every category/listing URL a redirect hop and
# disagreed with the canonical tags Astro bakes in. Verified live on the
# first deploy (2026-10-15): /latest → 307 /latest/, /about → 307 /about/.
# "drop-trailing-slash" restores Apache parity: 200 at the un-slashed URL,
# 308 home for the slashed variant.
html_handling = "drop-trailing-slash"
# Every request passes through worker/index.ts first — it owns the CSP
# dispatch, the security headers, the cache rules and the /verify rewrite.
# `_headers`/`_redirects` are not applied to worker-served requests, so this
# Worker is the single source of truth for response headers.
run_worker_first = true
